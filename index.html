id: "dcmotors", part: "Task 2: Motors", title: "DC Machine Principles & Motor Characteristics",
lectures: "Task 2 – DC Motors; DC Motor Characteristics", status: "lectured",
summary: "The linear machine (Lorentz force and back emf), motor vs generator action, commutation, the DC machine equations, torque–speed lines for PM, shunt and series motors, and how brushed, brushless, universal and stepper motors compare.",
theory: R`
<h3>0. The linear machine</h3>
<p>A bar on rails in a perpendicular field $B$, fed from $V_T$ through $R_A$:</p>
<ul>
<li>At start: $i_A = V_T/R_A$, force $F = i_Al\times B$ pushes the bar.</li>
<li>As it moves at speed $u$ it cuts flux: back emf $e_A = Blu$ opposes the supply, so $i_A = (V_T - e_A)/R_A$ falls.</li>
<li>With no load it settles where $e_A = V_T$.</li>
<li><b>Motor action:</b> a load slows the bar, $e_A$ drops, current flows and the force balances the load (electrical → mechanical).</li>
<li><b>Generator action:</b> push it faster, $e_A > V_T$, current reverses (mechanical → electrical).</li>
</ul>

<h3>1. Construction and commutation</h3>
<p>Stator: field windings or permanent magnets (even number of poles). Rotor: laminated iron with the armature windings in slots. The <b>commutator</b> (copper segments) and graphite <b>brushes</b> reverse the armature current every half-turn so torque stays one direction. Downsides: wear, sparking/EMI, speed limit, maintenance.</p>

<h3>2. The DC machine equations</h3>
$$V_T = R_AI_A + E_A,\quad E_A = K\phi\omega_m,\quad T_{dev} = K\phi I_A,\quad P_{dev} = E_AI_A = T_{dev}\omega_m$$
<p>$K$ is the machine constant, $\phi$ the flux per pole. $T_{out} < T_{dev}$ because of rotational losses (friction, windage, eddy, hysteresis, roughly ∝ speed). Magnetisation curve: $E_A$ vs field current at fixed speed has the shape of $\phi$ vs $I_F$ and flattens with saturation; $E_{A1}/E_{A2} = n_1/n_2$.</p>

<h3>3. Torque–speed characteristics</h3>
<p><b>PM and shunt / separately excited</b> ($\phi$ constant): a straight line</p>
$$T_{dev} = \frac{K\phi}{R_A}(V_T - K\phi\omega_m),\qquad T_{stall} = \frac{K\phi V_T}{R_A},\qquad \omega_{no\,load} = \frac{V_T}{K\phi}$$
<p>Raising $V_T$ shifts the line outward in parallel: simple speed control. Shunt power flow: $P_{in} = V_TI_L$, field loss $V_T^2/(R_F + R_{adj})$, armature loss $I_A^2R_A$.</p>
<p><b>Series</b> ($I_A = I_F$, $\phi = K_FI_A$):</p>
$$T_{dev} = KK_FI_A^2 = \frac{KK_FV_T^2}{(R_F + R_A + KK_F\omega_m)^2}$$
<p>Huge starting torque, speed falls steeply with load, dangerous (runaway) unloaded.</p>

<h3>4. Motor comparison</h3>
<div class="tbl"><table class="data">
<tr><th>Type</th><th>Character</th><th>Typical uses</th></tr>
<tr><td>PM brushed</td><td>Linear T–ω, simple control, compact; brush wear; flux fixed</td><td>Window motors, small tools, robotics</td></tr>
<tr><td>Shunt</td><td>Nearly constant speed, good regulation, field adjustable</td><td>Machine tools</td></tr>
<tr><td>Series</td><td>Very high starting torque, T ∝ I²</td><td>Starters, traction, cranes</td></tr>
<tr><td>Compound</td><td>Between shunt and series</td><td>Elevators</td></tr>
<tr><td>Universal</td><td>Series motor on ac or dc, laminated stator, fast, noisy</td><td>Power tools, vacuums</td></tr>
<tr><td>Brushless (BLDC)</td><td>PM rotor, electronic commutation (Hall/encoder), 85–95% efficient</td><td>Drones, EVs, HDDs</td></tr>
<tr><td>Stepper</td><td>Discrete steps (1.8° = 200/rev), open-loop position, holding torque</td><td>3D printers, CNC</td></tr>
</table></div>

<h3>5. Speed control of wound-field motors</h3>
<p>Below rated speed: vary armature voltage at full field (constant torque available). Above rated speed: <b>field weakening</b>, reduce $I_F$ so $\phi$ falls and $\omega \propto 1/\phi$ rises; torque drops, power stays constant.</p>`,
formulas: [
 {name:"Armature KVL", tex:R`V_T = R_AI_A + E_A`},
 {name:"Back emf", tex:R`E_A = K\phi\omega_m`},
 {name:"Torque", tex:R`T_{dev} = K\phi I_A`},
 {name:"Power", tex:R`P_{dev} = E_AI_A = T_{dev}\omega_m`},
 {name:"PM / shunt T–ω", tex:R`T = \frac{K\phi}{R_A}(V_T - K\phi\omega)`},
 {name:"Stall & no-load", tex:R`T_{stall} = \frac{K\phi V_T}{R_A},\ \omega_{0} = \frac{V_T}{K\phi}`},

],

 {src:"Practice (Claude)", see:[2,3], q:R`A PM dc motor has $R_A = 2$ Ω and $K\phi = 0.05$ V·s/rad, supplied at 12 V. Find the stall torque, no-load speed (rpm), and the speed, current and developed power at a load torque of 0.1 N·m (ignore rotational losses).`,

  sol:R`<div class="tbl"><table class="data"><tr><th></th><th>PM brushed dc</th><th>Stepper</th></tr>
  <tr><td>Control</td><td>Continuous rotation, no position info; needs encoder + closed loop</td><td>Discrete 1.8° steps; position known by counting; open loop</td></tr>

  <tr><td>Repeatability</td><td>Feedback corrects drift</td><td>Inherently repeatable, but lost steps go undetected</td></tr>
  <tr><td>Holding torque</td><td>None passively; servo must actively hold</td><td>Strong holding torque whenever energised</td></tr>
  <tr><td>Maintenance</td><td>Brushes wear, EMI</td><td>Brushless, essentially maintenance-free</td></tr>
  <tr><td>Efficiency</td><td>Higher, better at speed</td><td>Lower, runs warm, resonance</td></tr></table></div>
  <p><b>Stepper</b> is the better choice here.</p>`,

id: "drive", part: "Task 2: Motors", title: "H-Bridges, PWM & Stepper Control on the ESP32",
lectures: "Task 2 – DC Motor Control and Encoders; DC Motor Characteristics (stepper control); Task 2 description", status: "lectured",
summary: "Why an H-bridge is needed, direction and braking, PWM speed control and its practicalities, current sensing, open vs closed loop (P and PI), servos, and driving a bipolar stepper through an SN754410 with full-step sequences. Q4 on every past paper.",
theory: R`
<h3>0. Why an H-bridge</h3>
<ul>
<li>Lets logic-level signals control a higher-voltage supply to the motor, so the ESP32 sets the <b>polarity</b> across the motor ⇒ bidirectional control.</li>
<li>A PWM on an input sets the average voltage ⇒ <b>speed</b> control.</li>
<li>Without it, ESP32 pins give too little voltage and can't supply motor current. The H-bridge gives some protection, but not full isolation.</li>
</ul>
<div class="tbl"><table class="data">
<tr><th>1A</th><th>2A</th><th>Motor</th></tr>
<tr><td>H (or PWM)</td><td>L</td><td>Clockwise</td></tr>
<tr><td>L</td><td>H (or PWM)</td><td>Anti-clockwise</td></tr>
<tr><td>H</td><td>H</td><td><b>Brake</b>: both terminals at the supply, motor shorted; any back emf drives a current that resists rotation</td></tr>
<tr><td colspan="2">EN low</td><td>Coast (outputs off)</td></tr>
</table></div>
<p>Good practice: disable the enable pin, change the inputs, re-enable.</p>

<h3>1. PWM speed control</h3>
<p>$V_A = I_AR_A + K_e\omega_m$; with light load $V_A \propto \omega_m$. PWM duty cycle $D = t_{on}/T$ gives $V_{avg} = DV_{supply}$; the motor's inductance smooths the current. On the ESP32 Arduino core, <code>analogWrite(pin, 0–255)</code>.</p>
<ul>
<li>&lt; 2 kHz: audible whine; 20–50 kHz: good; &gt; 50 kHz: high switching losses.</li>
<li><b>Dead-time</b> (a short delay when switching) stops both transistors in one leg conducting together (shoot-through = supply shorted).</li>
</ul>

<h3>2. Current sensing and control loops</h3>
<p>Shunt resistor: $I_A = V_{shunt}/R_{shunt}$, cheap and accurate but intrusive ($I^2R$ loss), the mV signal needs amplifying, and it must be rated $P > I_{max}^2R$. Hall-effect sensor: isolated and non-invasive, but dearer and less accurate at low current.</p>
<p><b>Open loop</b>: no feedback, can't correct for load changes. <b>Closed loop</b>: error = setpoint − measured. P control $u = K_pe$ leaves a steady-state error under load; PI $u = K_pe + K_i\int e\,dt$ removes it.</p>
<p><b>Hobby servos</b>: motor + gearbox + pot + controller in one unit; a 50 Hz signal whose <b>pulse width</b> (≈1–2 ms) sets the angle. For limited-range positioning, not continuous speed.</p>

<h3>3. Steppers</h3>
<p>Brushless; the rotor follows a stator field held at discrete positions. Hybrid is most common, 1.8° per step (200 steps/rev). Bipolar: one winding per phase, needs an H-bridge per phase, 4 wires, full torque. Unipolar: centre-tapped, simpler drive, about 70% of the torque.</p>
<div class="tbl"><table class="data">
<tr><th>Step</th><th>A</th><th>B</th></tr>
<tr><td>1</td><td>+</td><td>+</td></tr>
<tr><td>2</td><td>−</td><td>+</td></tr>
<tr><td>3</td><td>−</td><td>−</td></tr>
<tr><td>4</td><td>+</td><td>−</td></tr>
</table></div>
<p>Step 1→4 one way, 4→1 the other. Half-step doubles the resolution (400/rev); microstepping uses sine-weighted currents (1600, 3200+). Driver ICs (A4988, DRV8825, TMC2208) take STEP and DIR pulses.</p>
<p><b>Speed:</b> steps per second = rpm × steps/rev ÷ 60, so delay per step = 60 000 ms / (rpm × steps/rev). At 1 rpm with 200 steps/rev: 300 ms per step.</p>

<h3>4. Exam-style code pattern</h3>
<pre>void motorCW(int duty) {          // duty 0–255
  digitalWrite(EN, LOW);
  direction = 1;  count = 0;
  analogWrite(IN_1A, duty);
  digitalWrite(IN_2A, LOW);
  digitalWrite(EN, HIGH);
}
void motorBrake() {               // both sides high = shorted motor
  digitalWrite(EN, LOW);
  digitalWrite(IN_1A, HIGH); digitalWrite(IN_2A, HIGH);
  digitalWrite(EN, HIGH);
}
void IRAM_ATTR ISR() { count += direction; }</pre>
<p>Sequence long tasks with a <code>stage</code> variable in <code>loop()</code> and compare <code>count</code> with the target. For fractions of a turn use <code>CHANGE</code> interrupts to double the counts.</p>`,
formulas: [
 {name:"PWM average", tex:R`V_{avg} = D\,V_{supply},\ D = t_{on}/T`},

],
questions: [
 {src:"Exam 2025 Q4(a)", see:[0], q:R`Explain why the H-bridge is necessary and why the ESP32 can't drive the motor directly.`,
  hint:"Direction, speed, voltage and current, protection.",
  sol:R`<p>The H-bridge lets logic-level inputs switch a higher-voltage supply across the motor; its output polarity follows the inputs, giving bidirectional control, and PWM on an input controls speed. It gives some (not complete) protection to the ESP32.</p>
  <p>Directly, the ESP32's logic voltage would be too low to drive the motor and the motor current far too high for its pins.</p>`,

  sol:R`<p>200 steps per rotation. Delay per step at 1 rpm = 300 ms.</p>
<pre>void setup() {

  rotate(-1, 200, 300);     // 1 rev CCW at 1 rpm

void loop() { }

void rotate(int dir, unsigned long steps, unsigned int ms) {

 {src:"Exam 2025 Q4(c)", see:[4,1], q:R`A brushed motor with a 10-gap encoder (rising-edge interrupt) on an H-bridge. Outline code to: 1 turn CW; stop 2 s; 1 turn CW at about half speed; stop 2 s; 0.75 turn anti-clockwise; stop.`,
  hint:"PWM for speed, a direction variable in the ISR, CHANGE interrupts for 20 counts/rev, and a stage variable.",

  <li><code>loop()</code> with <code>switch(stage)</code>: stage 1 wait for count ≥ 20 → brake, 2 s, CW at 125; stage 2 count ≥ 20 → brake, 2 s, CCW; stage 3 count ≤ −15 → brake.</li></ul>`,

id: "encoders", part: "Task 2: Motors", title: "Encoders, Interrupts & Signal Interfacing",
lectures: "Task 2 – DC Motor Control and Encoders", status: "lectured",
summary: "Incremental encoders (optical and Hall), quadrature signals and direction, 4× decoding and speed calculation, signal conditioning and noise immunity, and writing interrupt-driven encoder code on the ESP32.",
theory: R`
<h3>0. Incremental encoders</h3>
<p>They turn rotation into pulses and measure <b>change</b> in position (so they need homing at power-up). PPR = pulses per revolution per channel.</p>
<ul>
<li><b>Optical:</b> LED and detector through a slotted wheel (transmissive, very high resolution) or off a patterned disc (reflective, compact). Need a clean environment and precise alignment.</li>
<li><b>Magnetic / Hall:</b> a multipole magnet passes two Hall sensors 90° apart; comparators give digital outputs. Robust to dust, oil and vibration; long life.</li>
</ul>

<h3>1. Quadrature</h3>
<p>Two square waves A and B, 90° apart. If A leads B the shaft turns one way; if B leads A, the other. Check B's level on each rising edge of A. The pair cycles through four states (00, 01, 11, 10), so counting every edge on both channels gives <b>4 × PPR</b> counts per rev.</p>
$$\text{rpm} = \frac{\Delta C \times 60}{4\times\text{PPR}\times\Delta t}$$
<p>Short $\Delta t$: fast updates but noisy at low speed; long $\Delta t$: smooth but slow.</p>

<h3>2. Signal conditioning</h3>
<ul>
<li><b>Level matching:</b> divider from 5 V to ≤ 3.3 V (e.g. 2 kΩ / 3.3 kΩ ⇒ 3.1 V).</li>
<li><b>Noise immunity:</b> Schmitt triggers (hysteresis between rising and falling thresholds), RC low-pass ($f_c = 1/2\pi RC$, balanced against signal speed), pull-ups/pull-downs for open-collector outputs.</li>
<li><b>Protection</b> against ESD and overvoltage. Poor conditioning means damaged pins, miscounts and unreliable behaviour.</li>
</ul>

<h3>3. Interrupts on the ESP32</h3>
<ul>
<li>Interrupts only act when a pin changes, so no counts are missed even if <code>loop()</code> is busy (polling wastes time and misses edges).</li>
<li><code>attachInterrupt(digitalPinToInterrupt(pin), isr, CHANGE)</code>: <code>RISING</code> counts one edge per pulse; <code>CHANGE</code> counts both.</li>
<li>Variables changed in an ISR must be <code>volatile</code>; <code>IRAM_ATTR</code> puts the ISR in fast RAM.</li>
<li>Keep ISRs short: set a flag or update a counter; do timing in <code>loop()</code>.</li>
</ul>

<h3>4. Full 4× quadrature decoder</h3>
<p>Attach <code>CHANGE</code> interrupts to <b>both</b> A and B, and use the previous and current states (4 bits):</p>
<pre>volatile long position = 0;
volatile bool Aprev, Bprev;
void IRAM_ATTR encoderISR() {
  bool A = digitalRead(ENC_A), B = digitalRead(ENC_B);
  uint8_t s = (Aprev &lt;&lt; 3) | (Bprev &lt;&lt; 2) | (A &lt;&lt; 1) | B;
  if (s==0b1110 || s==0b0111 || s==0b0001 || s==0b1000) position++;  // CW
  if (s==0b1101 || s==0b0100 || s==0b0010 || s==0b1011) position--;  // CCW
  Aprev = A; Bprev = B;
}</pre>`,
formulas: [
 {name:"Counts per rev (4×)", tex:R`4\times\text{PPR}`},
 {name:"Speed", tex:R`\text{rpm} = \frac{60\,\Delta C}{4\,\text{PPR}\,\Delta t}`},
 {name:"RC filter", tex:R`f_c = \frac{1}{2\pi RC}`},
 {name:"Level divider", tex:R`V_{out} = V_{in}\frac{R_2}{R_1+R_2}`}
],
questions: [
 {src:"Exam 2026 Q3(c)", see:[3,4,1], q:R`The given code increments <code>position</code> on each RISING edge of channel A only. Adapt it so <code>position</code> increases clockwise and decreases anti-clockwise, with the highest possible resolution.`,
  hint:"Both channels, CHANGE, compare previous and current A/B states.",
  sol:R`<p>Store the previous A and B; attach <code>CHANGE</code> interrupts to <b>both</b> pins (the posted answer attaches A twice by mistake); in the ISR form the 4-bit code (Aprev Bprev A B), increment for the CW transitions and decrement for the CCW ones (see section 4). This counts all four edges per cycle: 4 × 8 = 32 counts per rev instead of 8.</p>`,

  hint:"Same square waves, but which leads swaps.",
  sol:R`<p>Two equal square waves offset by a quarter period. (i) A leads B by 90°. (ii) B leads A by 90°. (Which you call clockwise depends on the sensor placement; the point is that the lead swaps.)</p>`,

 {src:"Practice (Claude)", see:[1], q:R`An 8-PPR encoder read in 4× mode counts 160 edges in 0.1 s. What is the shaft speed?`,
  hint:"Counts per rev = 32.",

  ans:"3000 rpm", prov:"Worked by Claude."}
],

<h3>0. Thyristor (SCR) modes</h3>
<ul>
<li><b>Reverse blocking:</b> reverse-biased like a diode; off, leakage only.</li>
<li><b>Forward blocking:</b> forward-biased but not yet triggered (no gate current); off.</li>
<li><b>Forward conducting:</b> triggered by a gate pulse; stays on, even with no gate signal, until the current falls below the <b>holding current</b> $I_H$.</li>
</ul>
<p><b>TRIAC</b>: conducts both ways, like two anti-parallel thyristors with one gate, so it can control both half-cycles of ac (preferred for ac motors and heaters). <b>DIAC</b>: a gateless TRIAC that conducts once its symmetric breakover voltage is reached.</p>

<h3>1. Phase control</h3>
<p>The <b>firing angle</b> α is measured from the zero crossing (0–180° each half-cycle). Firing later delivers less of each half-cycle to the load, so less average power. Delay in time: $t = \dfrac{\alpha}{360^\circ}\cdot\dfrac{1}{f}$, e.g. 90° at 50 Hz = 5 ms.</p>
<p>The load voltage jumps from 0 to the source voltage at firing, follows the source, then drops to 0 just before the zero crossing when the current falls below $I_H$.</p>

<h3>2. Optocoupled TRIAC driver (MOC3021/3031)</h3>
<ul>
<li>Isolates the logic side (ESP32) from mains, letting 3.3 V logic fire a high-voltage device.</li>
<li>Its small photo-TRIAC can't carry the load current, so it fires a power TRIAC (BT136) that does.</li>
<li>LED resistor: $R_1 = \dfrac{3.3 - V_F}{I_F}$ (≈ 35 Ω for 60 mA, $V_F$ = 1.2 V): use at least this to stay within $I_F$, while still giving enough trigger current.</li>
<li>Gate resistor $R_2 > V_{peak}/I_{TSM}$: e.g. $220\sqrt2/1\text{ A} = 311$ Ω, protecting the photo-TRIAC from turn-on surge.</li>
</ul>

<h3>3. Zero-crossing detection (H11L1 Schmitt optocoupler)</h3>
<ul>
<li>A <b>bridge rectifier</b> lets the single input LED light on both half-cycles (a pulse every 10 ms at 50 Hz) and protects it from 311 V reverse (rating 6 V).</li>
<li><b>Series resistor</b> sets the LED current between the turn-on threshold (1.6 mA) and the maximum (30 mA): $R \ge (311 - 1.2)/30\text{ mA} = 10.3$ kΩ; a 10 mA design gives 33 kΩ.</li>
<li><b>Decoupling capacitor</b> on the output-side supply gives clean switching edges.</li>
<li>The detector's edge often comes slightly before the true zero crossing; compensate in software.</li>
</ul>

<h3>4. Phase-control code</h3>
<pre>volatile bool zcFlag = false;
void IRAM_ATTR readZC_ISR() { zcFlag = true; }   // keep the ISR short
void loop() {
  if (zcFlag) {
    zcFlag = false;
    delayMicroseconds(ZC_COMPENSATION);                 // e.g. 1000 us
    delayMicroseconds(convert_phase_to_microsec(firingAngle, freq));
    digitalWrite(PIN_TRIAC, LOW);                         // fire (active low)
    delayMicroseconds(pulseWidth);
    digitalWrite(PIN_TRIAC, HIGH);
  }
}</pre>`,

theory: R`
<h3>0. The mass–spring model</h3>
<p>A mass $m$ (kg) on frictionless rollers, tied to a fixed point by a linear spring of stiffness $k$ (N/m). $x$ is measured from the equilibrium position. Hooke's law: spring force $F = kx$, and it always <b>opposes</b> the displacement.</p>
<p>Newton's 2nd law with the mass displaced in $+x$:</p>
$$-kx = m\ddot x \quad\Rightarrow\quad m\ddot x + kx = 0 \quad\Rightarrow\quad \ddot x + \frac{k}{m}x = 0$$
<div class="callout"><b>Free vibration</b> = the system moves on its own after being disturbed, with no ongoing external force. <b>Forced vibration</b> = an external force keeps driving it (Lecture 2).</div>

<h3>1. Solution and natural frequency</h3>
<p>Try $x = e^{rt}$: $r^2 + k/m = 0 \Rightarrow r = \pm i\sqrt{k/m}$. The real form of the solution is simple harmonic motion:</p>
$$x(t) = A\cos\omega_n t + B\sin\omega_n t,\qquad \omega_n = \sqrt{\frac{k}{m}}\ \text{rad/s}$$
<p>$f_n = \omega_n/2\pi$ (Hz) and the period is $\tau_n = 1/f_n = 2\pi/\omega_n$. The frequency depends only on $m$ and $k$, not on how hard you start it.</p>

<h3>2. Initial conditions, amplitude and phase</h3>
<p>Two constants need two initial conditions, usually $x(0)=x_0$ and $\dot x(0)=v_0$:</p>
<ul>
<li>Displacement only ($v_0=0$): $x = x_0\cos\omega_n t$.</li>
<li>Velocity only ($x_0=0$): $x = \dfrac{v_0}{\omega_n}\sin\omega_n t$.</li>
<li>Both: $x(t) = x_0\cos\omega_n t + \dfrac{v_0}{\omega_n}\sin\omega_n t = A\cos(\omega_n t + \phi)$</li>
</ul>
$$A = \sqrt{x_0^2 + \left(\frac{v_0}{\omega_n}\right)^2},\qquad \phi = \tan^{-1}\!\left(\frac{-v_0}{\omega_n x_0}\right)$$
<p>On a phasor diagram the real part is $x_0$ and the imaginary part is $v_0/\omega_n$; the phase angle sets where in the cycle the motion starts. Velocity and acceleration follow by differentiating: $v = -A\omega_n\sin(\omega_n t+\phi)$, $a = -A\omega_n^2\cos(\omega_n t+\phi) = -\omega_n^2 x$.</p>
<div class="callout key"><b>Peak values:</b> $v_{max} = A\omega_n$ and $a_{max} = A\omega_n^2$. Questions asking you to "plot displacement and velocity" want these two amplitudes and the 90° shift between them.</div>

<h3>3. Energy method</h3>
<p>With only a mass and a spring, energy is conserved: $KE + PE = $ constant, so $\frac{d}{dt}(KE+PE)=0$ and $PE_{max} = KE_{max}$.</p>
$$\frac{d}{dt}\left(\tfrac12 m\dot x^2 + \tfrac12 kx^2\right) = \dot x(m\ddot x + kx) = 0 \;\Rightarrow\; m\ddot x + kx = 0$$
<p>Strain energy stored in the spring is the area under the force–extension line: $\tfrac12 kX^2$.</p>

<h3>4. Gravity and static deflection</h3>
<p>Hang the mass vertically and the spring stretches by $\delta_{st}$ until $k\delta_{st} = mg$. Measuring $x$ from this <b>static equilibrium</b> position, gravity and the static spring force cancel and the equation of motion is unchanged: $m\ddot x + kx = 0$.</p>
$$k = \frac{mg}{\delta_{st}} \qquad\Rightarrow\qquad \omega_n = \sqrt{\frac{g}{\delta_{st}}}$$
<div class="callout"><b>Key point:</b> a static load moves the equilibrium position but does not change the oscillation.</div>

<h3>5. Torsional systems</h3>
<p>Same maths with rotation: inertia $I$ (kg·m²) replaces $m$, torsional stiffness $K_\theta$ (N·m/rad) replaces $k$:</p>
$$I\ddot\theta + K_\theta\theta = 0,\qquad \omega_n = \sqrt{K_\theta/I}$$
<p>For a lever, a spring at distance $l$ from the pivot gives $K_\theta = kl^2$ (force $kl\theta$ times arm $l$); a point mass at $l$ adds $ml^2$ to $I$; a uniform rod about its end has $I = ml^2/3$.</p>

<h3>6. Linearising a non-linear spring</h3>
<p>If the restoring force isn't linear in displacement, find the equilibrium position, then use the <b>local slope</b> as the stiffness for small vibrations: $k = \left|dF/dY\right|$ at equilibrium.</p>
<p><b>Lecture example (piston):</b> $m = 90$ kg, net gas force $F = 780/Y - 3000$ N, $g = 10$. Equilibrium: $780/Y - 3000 = 900 \Rightarrow Y = 0.2$ m. Stiffness: $dF/dY = -780/Y^2 = -19\,500$ N/m, so $k = 19.5$ kN/m and $\omega_n = \sqrt{19500/90} = 14.72$ rad/s. Displaced 2 mm down and released: $y(t) = -0.002\cos(14.72t)$ m.</p>

<h3>7. Properties of undamped systems</h3>
<ul>
<li>Conservative: no energy is lost, so it would oscillate forever (almost impossible in real machines).</li>
<li>Frequency depends only on stiffness and mass.</li>
<li>Two independent initial conditions fix the exact response.</li>
</ul>`,

id: "viscous", part: "Free vibration", title: "Viscous Damping & Logarithmic Decrement",
lectures: "Lecture 1 (slides 37–52)", status: "lectured",
summary: "Adding a dashpot: the damped equation of motion, critical damping and the damping ratio, under/critically/over-damped response, the damped natural frequency, and getting ζ from a measured decay with the logarithmic decrement.",
theory: R`
<h3>0. Viscous damping</h3>
<p>Real mechanical systems lose energy each cycle (friction, internal strain, fluid). A <b>dashpot</b> forces a plate through a fluid; its force is proportional to velocity and opposes it:</p>
$$F_c = c\dot x \qquad (c \text{ in N·s/m})$$
<p>Newton's 2nd law: $m\ddot x = -c\dot x - kx$, so</p>
$$m\ddot x + c\dot x + kx = 0$$

<h3>1. Characteristic equation and critical damping</h3>
<p>Try $x = Xe^{st}$: $ms^2 + cs + k = 0$, so $s_{1,2} = \dfrac{-c \pm \sqrt{c^2-4mk}}{2m}$. The term under the root decides the behaviour:</p>
<div class="tbl"><table class="data">
<tr><th>Case</th><th>Condition</th><th>Roots</th><th>Response</th></tr>
<tr><td>Underdamped</td><td>$c^2 < 4mk$ ($0<\zeta<1$)</td><td>complex conjugates</td><td>Decaying oscillation</td></tr>
<tr><td>Critically damped</td><td>$c^2 = 4mk$ ($\zeta = 1$)</td><td>real, repeated</td><td>Fastest return with no overshoot</td></tr>
<tr><td>Overdamped</td><td>$c^2 > 4mk$ ($\zeta>1$)</td><td>real, distinct</td><td>Slow, non-oscillatory creep back</td></tr>
</table></div>
$$c_{cr} = 2\sqrt{mk} = 2m\omega_n,\qquad \zeta = \frac{c}{c_{cr}} = \frac{c}{2\sqrt{mk}} = \frac{c}{2m\omega_n}$$
<p>With these, $s_{1,2} = -\zeta\omega_n \pm \omega_n\sqrt{\zeta^2 - 1}$.</p>

<h3>2. Underdamped response</h3>
$$x(t) = Ae^{-\zeta\omega_n t}\sin(\omega_d t + \phi),\qquad \omega_d = \omega_n\sqrt{1-\zeta^2}$$
<p>Equivalently $x(t) = e^{-\zeta\omega_n t}\left[B_1\cos\omega_d t + B_2\sin\omega_d t\right]$ with $B_1 = x_0$ and $B_2 = (v_0 + \zeta\omega_n x_0)/\omega_d$.</p>
<p>From initial conditions:</p>
$$A = \sqrt{x_0^2 + \left(\frac{v_0 + \zeta\omega_n x_0}{\omega_d}\right)^2},\qquad \phi = \tan^{-1}\frac{\omega_d x_0}{v_0 + \zeta\omega_n x_0}$$
<p>The envelope $\pm Ae^{-\zeta\omega_n t}$ bounds the peaks. The damped period is $\tau_d = 2\pi/\omega_d$, and $\omega_d < \omega_n$.</p>

<h3>3. Logarithmic decrement</h3>
<p>Successive peaks are one damped period apart, so their ratio is constant:</p>
$$\delta = \ln\frac{A_0}{A_1} = \zeta\omega_n\tau_d = \frac{2\pi\zeta}{\sqrt{1-\zeta^2}} \qquad\Leftrightarrow\qquad \zeta = \frac{\delta}{\sqrt{4\pi^2+\delta^2}}$$
<p>Over $n$ cycles: $n\delta = \ln(A_0/A_n)$. Using several cycles is more accurate than two neighbouring peaks. For small damping, $\zeta \approx \delta/2\pi$.</p>
<div class="callout key"><b>From a measured decay plot:</b> (1) read two peaks $n$ cycles apart → $\delta$; (2) $\zeta = \delta/\sqrt{4\pi^2+\delta^2}$; (3) time between them / $n$ → $\tau_d$ → $\omega_d$; (4) $\omega_n = \omega_d/\sqrt{1-\zeta^2}$; (5) $k = m\omega_n^2$, $c = 2\zeta m\omega_n$.</div>
<p>A half-cycle version is also used: peak-to-trough over half a cycle gives $\ln(X_1/X_{1.5}) = \delta/2$.</p>

<h3>4. Settling time</h3>
<p>The envelope falls to a fraction $p$ of its start when $e^{-\zeta\omega_n t} = p$, i.e. $t = \ln(1/p)/(\zeta\omega_n)$. In cycles: $n = \ln(1/p)/\delta$, and $t = n\tau_d$. These are the same thing.</p>

<h3>5. Energy lost per cycle</h3>
<p>With $x = X\sin\omega t$ the force–displacement plot of a spring plus dashpot is an ellipse. Its area is the energy dissipated per cycle:</p>
$$\Delta W = \oint F\,dx = \pi c\omega X^2$$

<h3>6. Rotational systems with damping</h3>
<p>Take moments about the pivot. A damper at arm $l_1$ gives damping torque $c l_1^2\dot\theta$; a spring at $l_3$ gives $kl_3^2\theta$:</p>
$$I\ddot\theta + C_\theta\dot\theta + K_\theta\theta = 0,\quad \zeta = \frac{C_\theta}{2\sqrt{IK_\theta}}$$`,
formulas: [

T.topics.push({
id: "coulomb", part: "Free vibration", title: "Coulomb (Dry Friction) & Hysteretic Damping",
lectures: "Lecture 1 (slides 53–72)", status: "lectured",
summary: "Dry friction: constant-magnitude force, linear amplitude decay, the dead zone and where the system stops. Hysteretic (material) damping: loop area, the equivalent viscous coefficient and the link to δ and ζ.",
theory: R`
<h3>0. Coulomb damping: the force</h3>
<p>Dry friction has constant magnitude $\mu N$ and always <b>opposes velocity</b>. Its direction flips at every peak and trough, so the equation changes every half-cycle:</p>
<div class="tbl"><table class="data">
<tr><th>Half-cycle</th><th>Equation</th><th>Temporary equilibrium</th></tr>
<tr><td>Moving in −x (negative velocity)</td><td>$m\ddot x + kx = +\mu N$</td><td>$x = +\mu N/k$</td></tr>
<tr><td>Moving in +x (positive velocity)</td><td>$m\ddot x + kx = -\mu N$</td><td>$x = -\mu N/k$</td></tr>
</table></div>
<p>Each half-cycle is a cosine about its own offset equilibrium at the <b>undamped</b> frequency $\omega_n = \sqrt{k/m}$. Friction does not change the frequency.</p>

<h3>1. Linear decay</h3>
<p>Starting from rest at $x_0$, after one half-cycle (time $\pi/\omega_n$) the mass reaches $-\left(x_0 - 2\mu N/k\right)$.</p>
$$\text{loss per half-cycle} = \frac{2\mu N}{k},\qquad \text{loss per full cycle} = \frac{4\mu N}{k}$$
<p>The peaks lie on <b>straight lines</b>, not an exponential. That is how you tell Coulomb damping from viscous damping on a plot. Slope of the envelope: $-4\mu N/(k\tau_n) = -4\mu N\omega_n/(2\pi k)$ per second.</p>

<h3>2. Dead zone and stopping</h3>
<p>Once the amplitude at a turning point satisfies $k|x| \le \mu N$, the spring can't overcome friction and the mass stops. It stops <b>inside the band $|x| \le \mu N/k$</b>, generally not at the original equilibrium.</p>
$$n_r = \frac{X_0 - \mu N/k}{2\mu N/k} = \frac12\left(\frac{kX_0}{\mu N} - 1\right)\ \text{half-cycles (round up)}$$
<p><b>Lecture example:</b> $X_0 = 10$ mm, $k = 10\,000$ N/m, $m = 1$ kg, $\mu = 0.12$, $g = 10$. Dead zone $\mu N/k = 0.12$ mm, loss per half-cycle 0.24 mm, $n_r = (10-0.12)/0.24 = 41.2$ half-cycles.</p>

<h3>3. Summary of Coulomb damping</h3>
<ul>
<li>Force constant, opposes velocity, flips at each extreme.</li>
<li>No effect on frequency.</li>
<li>Non-linear: the equation alternates every half-cycle.</li>
<li>Amplitude falls linearly by $4\mu N/k$ per cycle.</li>
<li>Stops when amplitude &lt; $\mu N/k$, displaced from the natural equilibrium.</li>
</ul>

<h3>4. Hysteretic (structural) damping</h3>
<p>Energy lost inside the material as it is cyclically strained (dislocation movement, internal friction). It appears as a hysteresis loop on the load–deflection plot and the lost energy shows up as heat. Experiments show the loss per cycle is <b>independent of frequency</b> and proportional to amplitude squared:</p>
$$\Delta W = \pi hX^2 \quad (h \text{ in N/m})$$
<p>Equating to the viscous loss $\pi c\omega X^2$ gives an equivalent viscous coefficient:</p>
$$c_{eq} = \frac{h}{\omega}$$
<p>The spring and hysteretic damper together act as a <b>complex stiffness</b> $k + ih$.</p>

<h3>5. δ and ζ for hysteretic damping</h3>
$$\delta = \frac{\pi h}{k},\qquad \zeta = \frac{h}{2k},\qquad \beta = \frac{h}{k}\ \text{(hysteretic damping constant, dimensionless)}$$
<p>For small damping $\omega_d \approx \omega_n$, so $c_{eq} = h/\omega_n$ at the natural frequency.</p>
<p><b>Reading a measured loop:</b> energy per cycle = area inside the loop; $k$ = slope of the loop's mean line; then $h = \Delta W/(\pi X^2)$. Lecture example: area 36 N·m at $X = 20$ mm gives $h = 28.65$ kN/m; with $k = 250$ kN/m, $\delta = 0.36$ and $\zeta = 0.057$.</p>`,
formulas: [
 {name:"Coulomb equation", tex:R`m\ddot x + kx = \mp\mu N`, note:"Sign opposes the velocity"},
 {name:"Loss per half-cycle", tex:R`\Delta = \frac{2\mu N}{k}`},
 {name:"Loss per cycle", tex:R`\frac{4\mu N}{k}`},
 {name:"Dead zone", tex:R`|x| \le \frac{\mu N}{k}`},
 {name:"Half-cycles to rest", tex:R`n_r = \frac12\left(\frac{kX_0}{\mu N} - 1\right)`},
 {name:"Hysteretic energy loss", tex:R`\Delta W = \pi hX^2`},
 {name:"Equivalent viscous", tex:R`c_{eq} = h/\omega`},
 {name:"Hysteretic δ and ζ", tex:R`\delta = \frac{\pi h}{k},\quad \zeta = \frac{h}{2k}`}
],
questions: [
 {src:"Tutorial 3 Q4", see:[0,1,2], q:R`A 10 kg mass slides on a surface with constant dry friction, attached to a wall by a 1000 N/m spring. It is pulled 50 mm right and released from rest; in the first half-cycle it reaches −40 mm. Find (a) $\omega_n$ and the period, (b) the friction force, (c) the amplitude at the end of the second full cycle, (d) how many half-cycles it executes and where it stops.`,

  <p>(b) $50 - 40 = 10$ mm $= 2F_f/k \Rightarrow F_f = 0.01(1000)/2 = 5$ N.</p>

  <p>(d) Dead zone: $F_f/k = 5$ mm. Turning points: 50, −40, 30, −20, 10 mm. At 10 mm the spring force (10 N) still beats friction (5 N), so it moves once more and reaches $-(10-10) = 0$ mm. That is inside the dead zone, so it stops.</p>
  <p>$n_r = \tfrac12(kX_0/F_f - 1) = \tfrac12(10-1) = 4.5$, so it completes <b>5 half-cycles</b> and comes to rest at the original equilibrium (0 mm), after $5 \times 0.314 = 1.57$ s.</p>`,
  ans:"ω_n = 10 rad/s, τ = 0.628 s; F = 5 N; 10 mm; 5 half-cycles, stops at 0 mm", prov:"Follows the posted solution."},
 {src:"Tutorial 3 Q3", fig:"mom_motor", see:[1,0], q:R`An electric motor of weight 500 N on two different foundations gives the free-vibration traces in Figures 2 and 3. For each, identify the damping type, the spring constant and damping coefficient, and the undamped and damped natural frequencies.`,
  hint:"Exponential envelope → viscous (use δ). Straight-line envelope → Coulomb (frequency unaffected; drop per half-cycle is 2μN/k).",
  sol:R`<p>$m = 500/9.81 = 50.97$ kg.</p>
  <p><b>Figure 2: viscous</b> (exponential envelope). Peaks 8 → 2 over two cycles: $2\delta = \ln 4 \Rightarrow \delta = 0.693$, $\zeta = 0.693/\sqrt{4\pi^2 + 0.693^2} = 0.110$.</p>
  <p>Two cycles in 0.35 s: $\tau_d = 0.175$ s, $\omega_d = 35.9$ rad/s, $\omega_n = 35.9/\sqrt{1-0.11^2} = 36.1$ rad/s.</p>
  <p>$k = m\omega_n^2 = 50.97(36.1)^2 \approx 66.5$ kN/m; $c = 2\zeta m\omega_n \approx 404$ N·s/m.</p>
  <p><b>Figure 3: Coulomb</b> (straight-line envelope). Three cycles in 0.55 s: $\tau_n = 0.183$ s, $\omega_n = \omega_d = 34.3$ rad/s (friction doesn't change frequency).</p>
  <p>$k = 50.97(34.3)^2 \approx 60.1$ kN/m.</p>
  <p>Peak 0 at 0.008 m, next trough at −0.007 m: $2\mu N/k = 0.001$ m, so $\mu N = 0.001(60\,071)/2 = 30$ N, and $\mu = 30/500 = 0.06$.</p>`,
  ans:"Viscous: k ≈ 66.5 kN/m, c ≈ 404 N·s/m, ω_n ≈ 36.1, ω_d ≈ 35.9 rad/s. Coulomb: k ≈ 60.1 kN/m, μN ≈ 30 N, ω_n = ω_d ≈ 34.3 rad/s", prov:"Follows the posted solution (values read from the figures)."},
 {src:"Tutorial 3 Q5", see:[4,5], q:R`A fibre-reinforced composite panel behaves as a single DOF system with $m = 1$ kg and $k = 2$ N/m. The ratio of successive amplitudes is 1.1. Find the hysteretic damping constant $\beta$, the equivalent viscous damping $c_{eq}$, and the energy lost per cycle at an amplitude of 10 mm.`,
  hint:"δ = ln 1.1, and for hysteretic damping δ = πh/k.",
  sol:R`<p>$\delta = \ln 1.1 = 0.0953$.</p>

  <p>$\omega_n = \sqrt{2/1} = 1.414$ rad/s, $c_{eq} = h/\omega_n = 0.0429$ N·s/m.</p>
  <p>$\Delta W = \pi hX^2 = \pi(0.0607)(0.01)^2 = 1.91\times10^{-5}$ J.</p>`,
  ans:"β = 0.0304, c_eq = 0.0429 N·s/m, ΔW = 1.91×10⁻⁵ J", prov:"Follows the posted solution."},
 {src:"Lecture 1 sample problem", see:[2], q:R`A 1 kg block on a surface with $\mu = 0.12$ is attached to a 10 000 N/m spring, displaced 10 mm and released ($g = 10$ m/s²). How many cycles of motion does it execute?`,
  hint:"Dead zone μN/k, loss 2μN/k per half-cycle.",
  sol:R`<p>$\mu N/k = 0.12(1)(10)/10\,000 = 0.12$ mm; loss per half-cycle 0.24 mm.</p>
  <p>$n_r = (10 - 0.12)/0.24 = 41.2$ half-cycles, so about 21 full cycles (41 complete half-cycles plus a part).</p>`,
  ans:"≈ 41 half-cycles (≈ 20.6 cycles)", prov:"From the worked example in Lecture 1."}
],
traps: [
 "Coulomb damping does NOT change the frequency. Use ω_n = √(k/m) and the undamped period.",

/* MEC1014 Mechanics of Machines — forced vibration (Lecture 2, Tutorials 4–5) and gears (Lecture 3) */
(function(){
const R = String.raw;
const T = STUDY.content.mom = STUDY.content.mom || { topics: [] };

T.topics.push({
id: "harmonic", part: "Forced vibration", title: "Harmonic Forcing & Frequency Response",
lectures: "Lecture 2 (slides 1–26)", status: "lectured",
summary: "A sinusoidal force on a mass–spring(–damper): total response = transient + steady state, the undamped amplitude and phase below/at/above resonance, the damped amplitude and phase lag, the dynamic magnification factor and the resonance peak.",
theory: R`
<h3>0. Total response = homogeneous + particular</h3>
<p>Equation: $m\ddot x + c\dot x + kx = f(t)$ with $f(t) = F\cos\omega t$ or $F\sin\omega t$, where $\omega$ is the <b>forcing</b> frequency.</p>
$$x(t) = x_h(t) + x_p(t)$$
<ul>
<li>$x_h$: free vibration at $\omega_n$ (or $\omega_d$). With damping it decays: the <b>transient</b>.</li>
<li>$x_p$: steady-state response at the forcing frequency $\omega$.</li>
</ul>
<div class="callout key"><b>Apply the initial conditions to the total response</b> $x_h + x_p$, never to $x_h$ alone.</div>

<h3>1. Undamped forcing</h3>
<p>$m\ddot x + kx = F\cos\omega t$. Try $x_p = X\cos\omega t$:</p>
$$X = \frac{F}{k - m\omega^2} = \frac{F/k}{1-(\omega/\omega_n)^2}$$
<p><b>Lecture example</b> ($k=1$, $F=1$, $\omega_n = 3$, $x_0 = 1$, $v_0 = 0$):</p>
<ul>
<li>$\omega = 2.5$: $X = 1/(1-0.694) = 3.27$, so $x = -2.27\cos 3t + 3.27\cos 2.5t$. $x_p$ is <b>in phase</b> with the force.</li>
<li>$\omega = 4$: $X = 1/(1-1.78) = -1.29$, so $x = 2.29\cos 3t - 1.29\cos 4t$. Negative $X$ means <b>180° out of phase</b>.</li>
</ul>

<h3>2. Resonance with no damping</h3>
<p>When $\omega = \omega_n$ the trial $X\cos\omega t$ gives zero on the left-hand side, so it fails. Use $x_p = t[C_1\cos\omega_n t + C_2\sin\omega_n t]$, which gives</p>
$$x_p(t) = \frac{F}{2m\omega_n}\,t\sin\omega_n t$$
<p>The amplitude grows linearly inside the envelope $\pm\dfrac{F}{2m\omega_n}t$, with a 90° phase lag. With no damping it grows without limit (the Tacoma Narrows bridge, 1940).</p>
<div class="tbl"><table class="data">
<tr><th>$\omega/\omega_n$</th><th>Phase</th><th>What the mass does</th></tr>
<tr><td>&lt; 1 (slow)</td><td>0°</td><td>Moves with the force</td></tr>
<tr><td>= 1 (resonance)</td><td>90°</td><td>Amplitude grows (∞ without damping)</td></tr>
<tr><td>&gt; 1 (fast)</td><td>180°</td><td>Moves opposite to the force</td></tr>
</table></div>

<h3>3. Damped steady state</h3>
<p>With $f = F\sin\omega t$, $x_p = X\sin(\omega t - \phi)$:</p>
$$X = \frac{F}{\sqrt{(k-m\omega^2)^2 + (c\omega)^2}} = \frac{F/k}{\sqrt{\left(1-r^2\right)^2 + (2\zeta r)^2}},\qquad r = \frac{\omega}{\omega_n}$$
$$\phi = \tan^{-1}\frac{c\omega}{k - m\omega^2} = \tan^{-1}\frac{2\zeta r}{1-r^2}$$
<p>$X_{static} = F/k$ is the deflection if the same force were applied slowly. The transient $x_h = Ae^{-\zeta\omega_n t}\sin(\omega_d t + \phi_{IC})$ dies away, leaving only $x_p$.</p>
<div class="callout"><b>Phase above resonance:</b> when $r > 1$ the denominator $1-r^2$ is negative, so the phase lag is between 90° and 180°. A calculator's $\tan^{-1}$ returns a negative angle: add 180°.</div>

<h3>4. Dynamic magnification factor</h3>
$$M = \frac{X}{X_{static}} = \frac{1}{\sqrt{(1-r^2)^2 + (2\zeta r)^2}}$$
<div class="tbl"><table class="data">
<tr><th></th><th colspan="2">Undamped</th><th colspan="2">Damped</th></tr>
<tr><th>Condition</th><th>M</th><th>φ</th><th>M</th><th>φ</th></tr>
<tr><td>$\omega \to 0$</td><td>→ 1</td><td>0°</td><td>→ 1</td><td>→ 0°</td></tr>
<tr><td>$\omega = \omega_n$</td><td>→ ∞</td><td>90°</td><td>$1/2\zeta$</td><td>90°</td></tr>
<tr><td>$\omega \to \infty$</td><td>→ 0</td><td>180°</td><td>→ 0</td><td>→ 180°</td></tr>
</table></div>

<h3>5. Resonance peak</h3>
<p>Setting $dM/dr = 0$:</p>
$$\frac{\omega_{max}}{\omega_n} = \sqrt{1-2\zeta^2},\qquad M_{max} = \frac{1}{2\zeta\sqrt{1-\zeta^2}}$$
<p>The peak sits slightly <b>below</b> $\omega_n$ (and below $\omega_d$), and there is no peak at all for $\zeta \ge 1/\sqrt2$. Example: $\zeta = 0.2 \Rightarrow \omega_{max} = 0.959\omega_n$, $M_{max} = 2.55$ (vs $1/2\zeta = 2.5$ at $\omega_n$).</p>

<h3>6. Phasor picture and the three zones</h3>
<p>The force $F$ balances three phasors: spring $kX$ (in phase with $x$), damper $c\omega X$ (90° ahead) and inertia $m\omega^2X$ (180°). By Pythagoras, $F^2 = (kX - m\omega^2X)^2 + (c\omega X)^2$.</p>
<ul>
<li>$\omega \ll \omega_n$: <b>stiffness-controlled</b>, $X \approx F/k$.</li>
<li>$\omega \approx \omega_n$: <b>damping-controlled</b>, $X \approx F/(c\omega)$.</li>
<li>$\omega \gg \omega_n$: <b>mass-controlled</b>, $X \approx F/(m\omega^2)$.</li>
</ul>
<p>Measured frequency-response functions show the same information as compliance $X/F$, mobility $V/F$ or inertance $A/F$, usually on log–log axes.</p>`,
formulas: [
 {name:"Undamped amplitude", tex:R`X = \frac{F/k}{1-(\omega/\omega_n)^2}`},
 {name:"Resonance (undamped)", tex:R`x_p = \frac{F}{2m\omega_n}t\sin\omega_n t`},
 {name:"Damped amplitude", tex:R`X = \frac{F/k}{\sqrt{(1-r^2)^2+(2\zeta r)^2}}`, note:"r = ω/ω_n"},

],
questions: [
 {src:"Tutorial 4 Q1", see:[1,0], q:R`A laser table is an undamped SDOF system with $m = 500$ g and $k = 18$ N/m. A fan applies $F(t) = 2\cos(5.5t)$ N. It starts from rest ($x_0 = 0$, $v_0 = 0$). Find $\omega_n$, say whether the steady state is in or out of phase with the force, and find the exact displacement $x(t)$.`,

 {src:"Tutorial 4 Q3", see:[3,4,2], q:R`A motor assembly: $m = 10$ kg, $k = 4000$ N/m, driven by $F(t) = 150\sin 20t$ N. (a) With $c = 80$ N·s/m find the steady-state amplitude and phase lag. (b) Write the form of $x_h(t)$; does it grow, stay or vanish? (c) What happens to the phase lag if the damper is removed?`,

T.topics.push({
id: "imbalance", part: "Forced vibration", title: "Rotating Imbalance & Base Excitation",
lectures: "Lecture 2 (slides 27–42)", status: "lectured",
summary: "Two common sources of forcing: an eccentric rotating mass (force grows with ω²) and movement of the support (vehicle on a road, isolation mounts). Amplitude, phase, resonance peaks and transmissibility.",
theory: R`
<h3>0. Eccentric rotating mass</h3>
<p>An out-of-balance mass $m_e$ at radius $r_e$ spinning at $\omega$ produces a force with vertical component</p>
$$f(t) = m_e r_e\omega^2\sin\omega t$$
<p>The force grows with the <b>square of the speed</b>. $m_e r_e$ (kg·m) is called the out-of-balance.</p>

<h3>1. Response to imbalance</h3>
<p>Substitute $F = m_e r_e\omega^2$ into the damped amplitude formula:</p>
$$X = \frac{m_e r_e\omega^2/k}{\sqrt{(1-r^2)^2+(2\zeta r)^2}}\qquad\Leftrightarrow\qquad \frac{mX}{m_e r_e} = \frac{r^2}{\sqrt{(1-r^2)^2+(2\zeta r)^2}}$$
<p>Here $m$ is the <b>total</b> mass of the machine (including $m_e$). Phase: same as for a direct force, $\phi = \tan^{-1}\frac{2\zeta r}{1-r^2}$.</p>
<ul>
<li>Low speed: $X \to 0$ (no force).</li>
<li>High speed: $mX/m_e r_e \to 1$, so $X \to m_e r_e/m$. The machine spins about the combined centre of mass.</li>
<li>Peak at $\omega/\omega_n = 1/\sqrt{1-2\zeta^2}$, slightly <b>above</b> $\omega_n$ because the force keeps rising with speed. $X_{max} = \dfrac{m_e r_e/m}{2\zeta\sqrt{1-\zeta^2}}$.</li>
</ul>

<h3>2. Worked example (lecture)</h3>
<p>A 35 kg motor at 60 Hz on a foundation with $k = 3$ MN/m and $c = 2000$ N·s/m; out-of-balance 0.2 kg·m.</p>
<ol class="steps">
<li>$\omega = 2\pi(60) = 377$ rad/s, $F = 0.2(377)^2 = 28\,426$ N.</li>
<li>$\omega_n = \sqrt{3\times10^6/35} = 292.8$ rad/s, $r = 1.29$, $\zeta = 2000/\sqrt{4(35)(3\times10^6)} = 0.098$.</li>
<li>$X_s = F/k = 9.48$ mm, $M = 1/\sqrt{(1-1.29^2)^2 + (2 \times 0.098 \times 1.29)^2} = 1.41$, so $X = 13.4$ mm.</li>
<li>$\tan^{-1}\frac{0.253}{1-1.664} = -20.8^\circ$ on a calculator. Since $r>1$ the actual lag is $180 - 20.8 = 159^\circ$.</li>
</ol>

<h3>3. Base (support) excitation</h3>
<p>Now the anchor moves, $y = Y\sin\omega t$, and the mass responds. The spring and damper act on the relative motion:</p>
$$m\ddot x = -c(\dot x - \dot y) - k(x - y)\ \Rightarrow\ m\ddot x + c\dot x + kx = c\dot y + ky$$

<h3>4. Transmissibility</h3>
$$\frac{X}{Y} = \sqrt{\frac{1 + (2\zeta r)^2}{(1-r^2)^2 + (2\zeta r)^2}}$$
$$\phi = \tan^{-1}\frac{2\zeta r}{1-r^2} - \tan^{-1}(2\zeta r)$$
<ul>
<li>$X/Y = 1$ at $r = 0$ and again at $r = \sqrt2$, for any damping.</li>
<li>Below $r=\sqrt2$, the mass moves <b>more</b> than the base, with a peak near resonance.</li>
<li>Above $r = \sqrt2$, $X/Y < 1$: <b>isolation</b>. Here less damping isolates better.</li>
</ul>
<div class="callout key"><b>Vibration isolation design rule:</b> make the mount soft enough that the operating frequency is well above $\sqrt2\,\omega_n$.</div>
<p>The same expression gives the force transmitted to the ground by a vibrating machine on a spring–damper mount, $F_T/F$.</p>

<h3>5. Road profiles and accelerations</h3>
<p>A vehicle at speed $v$ over a sinusoidal road of wavelength $\lambda$ sees base excitation at $f = v/\lambda$, i.e. $\omega = 2\pi v/\lambda$. The acceleration amplitude of the body is $\omega^2 X$.</p>`,
formulas: [
 {name:"Imbalance force", tex:R`F = m_e r_e\omega^2`},
 {name:"Imbalance response", tex:R`\frac{mX}{m_e r_e} = \frac{r^2}{\sqrt{(1-r^2)^2+(2\zeta r)^2}}`},
 {name:"Imbalance peak", tex:R`\frac{\omega_{max}}{\omega_n} = \frac{1}{\sqrt{1-2\zeta^2}}`},
 {name:"Base excitation EOM", tex:R`m\ddot x + c\dot x + kx = c\dot y + ky`},
 {name:"Transmissibility", tex:R`\frac{X}{Y} = \sqrt{\frac{1+(2\zeta r)^2}{(1-r^2)^2+(2\zeta r)^2}}`},
 {name:"Isolation", tex:R`X/Y<1 \iff r>\sqrt2`},
 {name:"Road forcing", tex:R`\omega = \frac{2\pi v}{\lambda}`}
],
questions: [
 {src:"Lecture 2 example", see:[2,1], q:R`A 35 kg electric motor running at 60 Hz is mounted on an elastic foundation with stiffness 3 MN/m and viscous damping 2000 N·s/m. The out-of-balance is 0.2 kg·m. Find the amplitude and phase of the response.`,
  hint:"F = m_e r_e ω². Then it's the standard damped amplitude formula; watch the phase since r > 1.",
  sol:R`<p>$\omega = 377$ rad/s, $F = 0.2(377)^2 = 28\,426$ N; $\omega_n = 292.8$ rad/s, $r = 1.29$; $\zeta = 0.098$.</p>
  <p>$M = \dfrac{1}{\sqrt{(1-1.664)^2 + (0.253)^2}} = 1.41$, $X_s = 28426/3\times10^6 = 9.48$ mm, $X = 13.4$ mm.</p>
  <p>$\tan^{-1}(0.253/-0.664)$: the lecture writes $-20.8^\circ$; since $r > 1$ the response actually lags the force by $180 - 20.8 \approx 159^\circ$.</p>`,
  ans:"X ≈ 13.4 mm, phase lag ≈ 159° (lecture: −20.8°)", prov:"From the worked example in Lecture 2. Claude added the note on the phase quadrant."},
 {src:"Tutorial 4 Q4", fig:"mom_bar", see:[3,4], q:R`A slender bar of mass $m$ is pivoted at $L/4$ from its left end. A damper $c$ acts at the left end; a spring $k$ at the right end connects to a support moving as $y = Y\sin\omega t$. With $k = 200\,000$ N/m, $c = 400$ N·s/m, $L = 1.2$ m, $m = 10$ kg, $Y = 0.01$ m and $\omega = 350$ rad/s, find the steady-state amplitude of angular oscillation.`,
  hint:"Pivot-based inertia: I = mL²/12 + m(L/4)². The spring at 3L/4 gives K_θ = k(3L/4)² and an excitation moment k(3L/4)Y sin ωt.",
  sol:R`<p>$I = \tfrac{1}{12}mL^2 + m(L/4)^2 = \tfrac{7}{48}mL^2 = 2.1$ kg·m²</p>
  <p>$K_\theta = k(3L/4)^2 = \tfrac{9}{16}kL^2 = 162\,000$ N·m/rad; $C_\theta = c(L/4)^2 = 36$ N·m·s/rad</p>
  <p>$$\tfrac{7}{48}mL^2\ddot\theta + \tfrac{1}{16}cL^2\dot\theta + \tfrac{9}{16}kL^2\theta = \tfrac34 kLY\sin\omega t$$</p>
  <p>$\omega_n = \sqrt{27k/7m} = 277.7$ rad/s; $\zeta = 3c/(14m\omega_n) = 0.0309$.</p>
  <p>$\theta_s = \dfrac{\tfrac34 kLY}{\tfrac{9}{16}kL^2} = \dfrac{4Y}{3L} = 0.0111$ rad; $r = 350/277.7 = 1.26$.</p>
  <p>$\theta = \dfrac{0.0111}{\sqrt{(1-1.26^2)^2 + (2 \times 0.0309 \times 1.26)^2}} = 0.0187$ rad (about 1.07°).</p>`,
  ans:"θ ≈ 0.0187 rad", prov:"Follows the posted solution."},
 {src:"Tutorial 5 Q1", fig:"mom_road", see:[3,4,5], q:R`A 500 kg vehicle body sits on a suspension modelled as a 400 000 N/m spring in parallel with a 3000 N·s/m damper. The rigid wheels follow a sinusoidal road with amplitude 0.01 m and wavelength 2.5 m. At 52 m/s, what is the acceleration amplitude of the vehicle?`,
  hint:"Forcing frequency = v/λ. Use the transmissibility X/Y, then acceleration = ω²X.",
  sol:R`<p>$f = 52/2.5 = 20.8$ Hz, $\omega = 130.7$ rad/s.</p>
  <p>$\omega_n = \sqrt{400000/500} = 28.28$ rad/s, $r = 4.62$; $\zeta = 3000/(2\sqrt{400000 \times 500}) = 0.106$, $2\zeta r = 0.980$.</p>
  <p>$\dfrac{X}{Y} = \sqrt{\dfrac{1 + 0.980^2}{(1-4.62^2)^2 + 0.980^2}} = \sqrt{\dfrac{1.960}{415.2}} = 0.0687$</p>
  <p>$X = 0.0687(0.01) = 0.687$ mm; acceleration amplitude $= \omega^2X = 130.7^2(0.000687) = 11.7$ m/s² (about 1.2 g).</p>`,
  ans:"≈ 11.7 m/s²", prov:"Worked by Claude. No solution has been posted for Tutorial 5. (The sheet gives the stiffness in N·s/m; it's treated as N/m.)"},
 {src:"Tutorial 5 Q2", fig:"mom_wash", see:[0,1], q:R`A washing machine has total mass 15 kg. A 0.8 kg lump of clothes sits at the drum radius of 200 mm; the drum turns at 1200 rpm. The spring stiffness is 350 N/mm and damping is neglected. Find the force in the spring.`,
  hint:"F = m_e r_e ω², X = F/(k − mω²) (undamped), spring force = kX.",
  sol:R`<p>$\omega = 1200(2\pi/60) = 125.7$ rad/s; $F = 0.8(0.2)(125.7)^2 = 2527$ N.</p>
  <p>$k = 350\,000$ N/m, $\omega_n = \sqrt{350000/15} = 152.8$ rad/s, $r = 0.823$ (below resonance, in phase).</p>
  <p>$X = \dfrac{2527}{350000 - 15(125.7)^2} = \dfrac{2527}{113\,130} = 22.3$ mm.</p>
  <p>Spring force amplitude $= kX = 350\,000(0.0223) \approx 7.8$ kN.</p>`,
  ans:"≈ 7.8 kN (X ≈ 22.3 mm)", prov:"Worked by Claude. No solution has been posted for Tutorial 5."}
],
traps: [
 "Imbalance force grows with ω², so the response tends to m_e r_e/m at high speed instead of zero.",

]

T.topics.push({
id: "gears", part: "Power transmission", title: "Gear Trains: Simple, Compound & Gearboxes",
lectures: "Lecture 3 (slides 1–22)", status: "lectured",
summary: "Gear terminology, speed and torque ratios for simple and compound trains, idler gears, power conservation, reflected inertia and accelerating a gear train, a manual gearbox, internal gears and rack and pinion.",
theory: R`
<h3>0. Terminology</h3>
<ul>
<li><b>Pitch circle</b>: the equivalent friction-roller circle; its diameter is the pitch diameter $d$.</li>
<li><b>Number of teeth</b> $N$; <b>module</b> $m = d/N$ (mm); <b>circular pitch</b> $p = \pi d/N$; <b>diametral pitch</b> $P_d = N/d$.</li>
<li><b>Pressure angle</b> $\phi$. Involute profiles give a straight line of contact.</li>
</ul>
<p>Meshing gears must have the same module, so $d_1/N_1 = d_2/N_2$.</p>

<h3>1. Speed and torque ratios</h3>
<p>The pitch-line speed is shared: $\omega_1 d_1 = \omega_2 d_2$, so</p>
$$\frac{\omega_{out}}{\omega_{in}} = \frac{N_{in}}{N_{out}} = \frac{d_{in}}{d_{out}}$$
<p>With no losses, power in = power out: $T_{in}\omega_{in} = T_{out}\omega_{out}$, so torque scales inversely with speed. Gearing down (slower output) multiplies torque.</p>
<div class="callout">References define "gear ratio" in different ways. The lecture uses $n = N_{in}/N_{out} = \omega_{out}/\omega_{in}$, giving $T_{out} = T_{in}/n$. Always write which way round you mean.</div>

<h3>2. Simple trains and idlers</h3>
<p>All gears in one plane. For A→B→C: $\dfrac{\omega_C}{\omega_A} = \dfrac{N_A}{N_C}$. The middle gear cancels out. An <b>idler</b> only changes the direction (or bridges a large centre distance); it does not change the ratio. Each external mesh reverses the direction.</p>

<h3>3. Compound trains</h3>
<p>Two gears on the same shaft turn together. For A→B, C on B's shaft, C→D:</p>
$$\frac{\omega_D}{\omega_A} = \frac{N_A}{N_B}\times\frac{N_C}{N_D}$$
<p>That is, the product of (driver teeth / driven teeth) over each mesh. Large reductions in a compact space.</p>
<p><b>Lecture example:</b> 20 kW at 15 Hz into A (with B on the same shaft): $T_A = 20\,000/(2\pi \cdot 15) = 212.2$ N·m $= T_B$. Mesh B (30 teeth) → C (48 teeth): $\omega_C = \omega_B(30/48) = 58.9$ rad/s, $T_C = 212.2(48/30) = 339.5$ N·m $= T_D$ (D shares C's shaft).</p>

<h3>4. Accelerating a gear train: reflected inertia</h3>
<p>An inertia $I_{out}$ on a shaft turning at $n$ times the input speed feels, at the input, like</p>
$$I_{eq} = n^2 I_{out},\qquad I_{system} = I_{in} + n^2 I_{out},\qquad T_{in} = I_{system}\,\alpha_{in}$$
<p>This collapses the whole drivetrain to one equivalent inertia on the input shaft.</p>

<h3>5. A manual gearbox</h3>
<p>Input shaft gear 1 always drives countershaft gear 2. Sliding gears pick which countershaft gear meshes with which output gear:</p>
<div class="tbl"><table class="data num">
<tr><th>Gear</th><th>Path</th><th>$\omega_{out}/\omega_{in}$</th><th>$T_{out}/T_{in}$</th></tr>
<tr><td>1st</td><td>1-2-5-8</td><td>$\frac{N_1N_5}{N_2N_8} = 0.1563$</td><td>6.40</td></tr>
<tr><td>2nd</td><td>1-2-4-7</td><td>0.3235</td><td>3.09</td></tr>
<tr><td>3rd</td><td>1-2-3-6</td><td>0.5930</td><td>1.686</td></tr>
<tr><td>4th</td><td>straight through</td><td>1</td><td>1</td></tr>
<tr><td>Reverse</td><td>1-2-5-9-10-8</td><td>$-\frac{N_1N_5N_{10}}{N_2N_9N_8} = -0.191$</td><td>−5.23</td></tr>
</table></div>
<p>Teeth: 1:17, 2:43, 3:36, 4:27, 5:17, 6:24, 7:33, 8:43, 9:18, 10:22. In reverse the idler shaft adds an extra mesh to flip the direction.</p>

<h3>6. Internal gears and rack &amp; pinion</h3>
<ul>
<li><b>Internal gear:</b> both turn the same way. Centre distance $(d_2 - d_1)/2$. Same ratio formula.</li>
<li><b>Rack and pinion:</b> converts rotation to translation, $v = r_p\omega_p$. One revolution moves the rack $\pi d_p = m\pi N_p$. Power: $T\omega = Fv$.</li>
</ul>`,
formulas: [
 {name:"Module", tex:R`m = \frac{d}{N}`, note:"Must match for meshing gears"},

 {src:"Lecture 3 example", see:[3,1], q:R`A motor supplies 20 kW at 15 Hz to gear A. B is on A's shaft and meshes with C (B has 30 teeth, C has 48); D is on C's shaft. With no losses, find the torque available at gear D.`,
  hint:"Same shaft → same speed and torque. Across a mesh the speed scales by N_driver/N_driven and torque by the inverse.",
  sol:R`<p>$T_A = \dfrac{P}{\omega} = \dfrac{20\,000}{2\pi(15)} = 212.2$ N·m, and $T_B = T_A$, $\omega_B = \omega_A = 94.2$ rad/s.</p>

 {src:"Lecture 3 gearbox", see:[5], q:R`For the gearbox with teeth 1:17, 2:43, 3:36, 4:27, 5:17, 6:24, 7:33, 8:43, 9:18, 10:22, find the speed ratio and torque ratio in 2nd gear (path 1-2-4-7) and in reverse (1-2-5-9-10-8).`,
  hint:"Multiply (driver/driven) for each mesh. Gears on the same shaft don't form a mesh.",
  sol:R`<p>2nd: meshes 1→2 and 4→7. $\dfrac{\omega_{out}}{\omega_{in}} = \dfrac{N_1}{N_2}\cdot\dfrac{N_4}{N_7} = \dfrac{17}{43}\cdot\dfrac{27}{33} = 0.3235$, torque ratio $1/0.3235 = 3.09$.</p>
  <p>Reverse: meshes 1→2, 5→9, 10→8 (9 and 10 share the idler shaft). $\dfrac{17}{43}\cdot\dfrac{17}{18}\cdot\dfrac{22}{43} = 0.191$, with the direction reversed: $-0.191$; torque ratio $-5.23$.</p>`,
  ans:"2nd: 0.3235 (torque ×3.09); reverse: −0.191 (torque ×5.23)", prov:"From the lecture's gearbox table; the reverse ratio was evaluated by Claude."}

T.topics.push({
id: "epicyclic", part: "Power transmission", title: "Epicyclic (Planetary) Gears",
lectures: "Lecture 3 (slides 23–38)", status: "lectured",
summary: "Sun, planets, ring and carrier: the geometry constraint, the Willis equation, the tabular method, the three standard fixed-member cases, torque balance, compound epicyclic trains and the equivalent inertia of a planetary system.",
theory: R`
<h3>0. The parts and geometry</h3>
<p><b>Sun</b> ($N_s$), <b>planets</b> ($N_p$), <b>ring</b> (internal teeth, $N_r$) and the <b>carrier</b> (arm/link) holding the planets. Geometry: $r_r = r_s + 2r_p$, so with equal module</p>
$$N_r = N_s + 2N_p,\qquad \text{carrier arm } l = r_s + r_p$$
<p>Adding identical planets on the same carrier doesn't change the kinematics; it shares the load.</p>

<h3>1. Willis equation</h3>
<p>Relative to the carrier, the train is a simple train (sun → planet → ring, with the ring turning the opposite way to the sun):</p>
$$\frac{\omega_s - \omega_c}{\omega_r - \omega_c} = -\frac{N_r}{N_s}\qquad\text{or}\qquad N_s(\omega_s - \omega_c) = N_r(\omega_c - \omega_r)$$
<p>Planet speed: $\omega_p = \omega_c - \dfrac{N_s}{N_p}(\omega_s - \omega_c)$.</p>

<h3>2. The three standard cases</h3>
<div class="tbl"><table class="data">
<tr><th>Fixed</th><th>Result</th></tr>
<tr><td>Ring ($\omega_r = 0$)</td><td>$\omega_s = \left(1 + \dfrac{N_r}{N_s}\right)\omega_c$: sun in, carrier out, big reduction, same direction</td></tr>
<tr><td>Sun ($\omega_s = 0$)</td><td>$\omega_r = \left(1 + \dfrac{N_s}{N_r}\right)\omega_c$: same direction</td></tr>
<tr><td>Carrier ($\omega_c = 0$)</td><td>$\omega_r = -\dfrac{N_s}{N_r}\omega_s$: an ordinary train, direction reversed</td></tr>
</table></div>

<h3>3. Tabular method</h3>
<p>Works for any arrangement:</p>
<ol class="steps">
<li>Lock everything and turn the whole assembly +1 rev: every member +1.</li>
<li>Fix the carrier and turn the member that is actually fixed −1 rev; work out the others by the simple-train ratios (sun −1 ⇒ planet $+N_s/N_p$, ring $+N_s/N_r$).</li>
<li>Add the rows. The fixed member now reads 0; the others give speeds per revolution of the carrier.</li>
</ol>
<div class="tbl"><table class="data">
<tr><th>Sun fixed</th><th>Carrier</th><th>Sun</th><th>Planet</th><th>Ring</th></tr>
<tr><td>Step 1</td><td>+1</td><td>+1</td><td>+1</td><td>+1</td></tr>
<tr><td>Step 2</td><td>0</td><td>−1</td><td>$+N_s/N_p$</td><td>$+N_s/N_r$</td></tr>
<tr><td>Sum</td><td>1</td><td>0</td><td>$1 + N_s/N_p$</td><td>$1 + N_s/N_r$</td></tr>
</table></div>

<h3>4. Torque balance</h3>
<p>No losses and no acceleration: power and torque both sum to zero across the three shafts:</p>
$$T_s\omega_s + T_c\omega_c + T_r\omega_r = 0,\qquad T_s + T_c + T_r = 0$$
<p>The fixed member's torque is the reaction the casing must provide. <b>Example</b> (ring fixed, $N_r = 100$, $N_s = 40$, 2 kW at 500 rpm into the sun): $T_s = 2000/52.36 = 38.2$ N·m, $T_c/T_s = -(1 + N_r/N_s) = -3.5 \Rightarrow T_c = -133.7$ N·m, $T_r = -(T_s + T_c) = 95.5$ N·m. Carrier speed $500/3.5 = 142.9$ rpm.</p>

<h3>5. Compound epicyclic trains</h3>
<p>Two or more coaxial simple trains where a member of one forms part of the next (e.g. ring 1 is the carrier of train 2, and the suns share a shaft). Use the tabular method on each train in turn, with the shared member's speed linking them.</p>

<h3>6. Equivalent inertia of a planetary system</h3>
<p>Refer everything to the input shaft with squared speed ratios. Planets have their own spin inertia and also orbit at the carrier radius (as point masses):</p>
$$I_{sys} = I_R + I_C\left(\frac{\omega_c}{\omega_r}\right)^2 + n_pI_P\left(\frac{\omega_p}{\omega_r}\right)^2 + n_pm_p\left(\frac{\omega_c}{\omega_r}\right)^2\left(\frac{d}{2}\right)^2$$`,
formulas: [
 {name:"Geometry", tex:R`N_r = N_s + 2N_p`},
 {name:"Willis equation", tex:R`\frac{\omega_s-\omega_c}{\omega_r-\omega_c} = -\frac{N_r}{N_s}`},
 {name:"Ring fixed", tex:R`\omega_s = \left(1+\frac{N_r}{N_s}\right)\omega_c`},
 {name:"Sun fixed", tex:R`\omega_r = \left(1+\frac{N_s}{N_r}\right)\omega_c`},
 {name:"Carrier fixed", tex:R`\omega_r = -\frac{N_s}{N_r}\omega_s`},
 {name:"Torque balance", tex:R`T_s+T_c+T_r = 0`},
 {name:"Power balance", tex:R`T_s\omega_s+T_c\omega_c+T_r\omega_r = 0`}
],
questions: [
 {src:"Lecture 3 example (torque)", see:[4,2], q:R`An epicyclic gear has $N_r = 100$ and $N_s = 40$. 2 kW at 500 rpm is applied to the sun shaft with the ring fixed. Find the carrier speed and the torques on the sun, carrier and ring.`,
  hint:"T_c/T_s = −ω_s/ω_c = −(1 + N_r/N_s). Then T_s + T_c + T_r = 0.",
  sol:R`<p>$\omega_s = 500(2\pi/60) = 52.36$ rad/s, $T_s = 2000/52.36 = 38.2$ N·m.</p>
  <p>Ring fixed: $\omega_s/\omega_c = 1 + 100/40 = 3.5$, so $\omega_c = 142.9$ rpm (same direction).</p>
  <p>$T_c = -3.5 T_s = -133.7$ N·m (the output torque, opposing the motion as a load).</p>
  <p>$T_r = -(T_s + T_c) = 95.5$ N·m: the reaction the casing provides to hold the ring.</p>`,
  ans:"ω_c ≈ 143 rpm; T_s = 38.2, T_c = −133.7, T_r = 95.5 N·m", prov:"From the worked example in Lecture 3."},
 {src:"Lecture 3 example system", see:[3,6], q:R`Ring R (100 internal teeth) meshes with three planets P (30 teeth) on carrier C; the planets mesh with sun S (40 teeth) and sit on a 120 mm diameter circle. Each planet has mass 500 g and inertia 0.15 g·m² about its own axis. $I_R = 4.8$ g·m², $I_C = 2.4$ g·m². S is fixed and R turns at 700 rpm. Find the speeds of C and of each planet, and the torque at R needed for an angular acceleration of 50 rad/s².`,
  hint:"Sun-fixed row of the table: carrier 1, planet 1 + N_s/N_p, ring 1 + N_s/N_r. Then refer every inertia to R with (speed ratio)².",
  sol:R`<p>$\omega_r/\omega_c = 1 + 40/100 = 1.4 \Rightarrow \omega_c = 700/1.4 = 500$ rpm.</p>
  <p>$\omega_p/\omega_c = 1 + 40/30 = 2.333 \Rightarrow \omega_p = 1167$ rpm.</p>
  <p>Ratios to R: $\omega_c/\omega_r = 0.714$, $\omega_p/\omega_r = 1.667$; planet orbit radius 0.06 m.</p>
  <p>$I_{sys} = 4.8 + 2.4(0.714)^2 + 3(0.15)(1.667)^2 + 3(500)(0.714)^2(0.06)^2$ g·m²</p>
  <p>$= 4.8 + 1.224 + 1.250 + 2.755 = 10.03$ g·m² $= 10.03\times10^{-3}$ kg·m²</p>
  <p>$T_R = I_{sys}\alpha = 10.03\times10^{-3}(50) = 0.501$ N·m.</p>`,
  ans:"ω_c = 500 rpm, ω_p ≈ 1167 rpm, T_R ≈ 0.50 N·m", prov:"From the worked example in Lecture 3."},
 {src:"Lecture 3 example (carrier fixed)", see:[2,4], q:R`Same gear ($N_r = 100$, $N_s = 40$), 2 kW at 500 rpm into the sun, but now the carrier is fixed and the ring is the output. Find the ring speed and the torques.`,
  hint:"With the carrier fixed it's an ordinary train: ω_r = −(N_s/N_r)ω_s.",
  sol:R`<p>$\omega_r = -(40/100)(500) = -200$ rpm (opposite direction).</p>
  <p>$T_s = 38.2$ N·m; $T_r = -T_s\omega_s/\omega_r = 38.2/0.4 = 95.5$ N·m.</p>
  <p>$T_c = -(T_s + T_r) = -133.7$ N·m (reaction on the fixed carrier).</p>`,
  ans:"ω_r = −200 rpm; T_r = 95.5 N·m, T_c = −133.7 N·m", prov:"From the worked example in Lecture 3."}
],
traps: [
 "Willis equation sign: relative to the carrier, sun and ring turn in opposite directions, hence the minus sign.",
 "N_r = N_s + 2N_p. Use it to find a missing tooth count.",
 "The fixed member still carries torque: T_s + T_c + T_r = 0.",

]
});

<h3>0. The challenge</h3>
<p>Design (Semester 1) and build (Semester 2) a device that carries a <b>500 mL</b> container of water up a <b>1 m ladder</b>:</p>
<ul><li>in the fastest possible time,</li><li>losing the minimum amount of water,</li><li>weighing the least,</li><li>using the minimum material.</li></ul>
<p>These pull against each other: speed vs spillage, light weight vs stiffness and grip. The design is a balance.</p>

<h3>1. Hard constraints</h3>
<div class="tbl"><table class="data">
<tr><th>Constraint</th><th>Limit</th></tr>
<tr><td>Size</td><td>Fits inside a 250 × 250 × 250 mm cube at <b>all</b> stages of operation</td></tr>
<tr><td>Actuation</td><td>One pneumatic cylinder, 50 mm stroke</td></tr>
<tr><td>Control</td><td>Extension and retraction switched automatically by a 5/2 solenoid valve (microswitches, relays)</td></tr>
<tr><td>Materials</td><td>Mainly standard aluminium plate plus limited standard mechanical ("Meccano") parts</td></tr>
<tr><td>Manufacturing</td><td>Punching, shearing, hacksawing, filing, deburring, bending, forming</td></tr>
<tr><td>3D printing</td><td>Limited parts, mainly grippers and guides, on DCU printers only (Semester 2)</td></tr>
</table></div>
<p>Workshop: SG23–25. Technical contact: Michael Tyrrell (labs, materials, parts board outside SG23/24).</p>

<h3>2. Breaking it down</h3>
<p>Engineering aspects: <b>locomotion</b> (rung to rung), <b>grip</b> (no slipping), <b>stability</b> (balance and alignment), <b>actuation</b> (force and motion), <b>sensing</b> (position and limits), <b>control</b> (sequencing), <b>water protection</b> (vibration and spill), <b>reliability</b> (repeat without jamming or falling).</p>
<p>Ask before designing: budget; ladder dimensions and rung spacing; size and weight limits; allowed materials, actuators, sensors and controller; power source; required speed; acceptable spillage; safety requirements; manufacturing facilities.</p>

<h3>3. Semester 1 plan and marks (50% of the module)</h3>
<div class="tbl"><table class="data">
<tr><th>Week</th><th>Work</th><th>Marks (of Sem 1)</th></tr>
<tr><td>1</td><td>Project launch; constraints; start concepts</td><td>—</td></tr>
<tr><td>2</td><td>PDS and FMEA</td><td>—</td></tr>
<tr><td>3</td><td>Workshop, parts, design for manufacture</td><td>—</td></tr>
<tr><td>4</td><td>Climbing, gripper and stabiliser concepts; spring–damper location; start 3D models</td><td>—</td></tr>
<tr><td>5–6</td><td>Design review presentations</td><td>20%</td></tr>
<tr><td>7</td><td>Vibration isolation and spring–damper design</td><td>—</td></tr>
<tr><td>8</td><td>Pneumatic sequence, relay logic, microswitches, circuit</td><td>—</td></tr>
<tr><td>9</td><td>SolidWorks assembly and exploded-view animation</td><td>15%</td></tr>
<tr><td>10</td><td>Spring–damper and circuit design review</td><td>10%</td></tr>
<tr><td>11</td><td>Final design motion simulation (SW motion study)</td><td>15%</td></tr>
<tr><td>12</td><td>Engineering drawings and order list review</td><td>20%</td></tr>
<tr><td>13</td><td>Design portfolio submission</td><td>20%</td></tr>
</table></div>
<p>Semester 2 (the other 50%): competition, updated portfolio, team video and build quality 60%; competition performance 20%; attendance and participation 20%.</p>

<h3>4. Running the team</h3>
<ul>
<li>Common goal, a team leader who tracks actions, clear responsibilities, use of different strengths (CAD, analysis, control, manufacture, testing), open communication, dependability.</li>
<li>Every meeting: agenda, short, everyone reports progress and problems, decisions agreed, <b>actions with owners and deadlines</b>, recorded, next meeting set. Log meetings and email the actions.</li>
<li>Avoid: one person doing everything; working separately and "stitching together" at the end; unclear roles; saving problems for meetings; leaving work to the deadline.</li>
</ul>`,
formulas: [],
questions: [
 {src:"Lecture 1 exercise", see:[2], q:R`You're asked to design a ladder-climbing robot to carry 500 mL of water up a 1 m ladder with minimum spillage. List the key engineering aspects, and the information you'd ask your manager for first.`,
  hint:"Think subsystems, then the numbers you can't design without.",
  sol:R`<p><b>Aspects:</b> locomotion, grip, stability, actuation, sensing, control, water protection (vibration), reliability.</p><p><b>Ask for:</b> budget; ladder dimensions and rung spacing; size/weight limits; permitted materials, actuators, sensors and controller; power source; required speed; acceptable spillage; safety requirements; available manufacturing processes.</p>`,
  ans:"8 aspects; ~12 questions", prov:"Lecture 1 answers."}
],
traps: [
 "The 250 mm cube applies at ALL stages of the motion, including full extension.",
 "One cylinder, 50 mm stroke: everything moves from that single actuator.",
 "3D printing is limited (mainly grippers and guides) and only on DCU printers.",
 "Week 9–13 deliverables are 80% of Semester 1: start CAD early."
]
});

T.topics.push({
id: "pds", part: "Design method", title: "The Design Process & Product Design Specification",
lectures: "Lecture 2 – Product Design Specifications (part 1)", status: "lectured",
summary: "The four phases of design, six design philosophies, what a PDS is and where its inputs come from, the twelve PDS headings with the folding e-scooter worked example, testable numbers instead of adjectives, and resolving headings that contradict each other.",
theory: R`
<h3>0. Four phases</h3>
<ol class="steps">
<li><b>Product planning:</b> identify the need, set the target specification (Semester 1).</li>
<li><b>Conceptual design:</b> generate concepts, select one, test it (Semester 1).</li>
<li><b>Embodiment design:</b> final specification, manufacturing plan, economics.</li>
<li><b>Detail design:</b> modelling, simulation, prototyping (Semester 2).</li>
</ol>
<p>Three questions run through it: <i>What exactly is the problem? What are the options? Which one, and why?</i></p>

<h3>1. Six ways to ask "is this a good design?"</h3>
<ol>
<li>User/customer-centred: does it solve a real user need?</li>
<li>Design thinking: have we understood the problem before jumping to a solution?</li>
<li>Function-first: what must it actually do?</li>
<li>Design for manufacture and assembly: can we make and assemble it efficiently?</li>
<li>Design for X: cost, quality, reliability, service, sustainability?</li>
<li>Sustainable/circular: what happens over the whole life cycle?</li>
</ol>

<h3>2. What a PDS is</h3>
<p>The functional, performance, physical, cost, safety, regulatory and other requirements and constraints the product must satisfy. Inputs: the customer/user, market and competitors, standards and regulation, manufacturing capability, service and maintenance, end of life.</p>
<div class="callout key"><p><b>A brief is not a specification.</b> "Light, portable and legal" can't be tested. A specification is a list of numbers a prototype can pass or fail. If you can't test it, it's an opinion, and opinions can't be defended.</p></div>
<p>Constraints come before concepts (Irish e-scooter rules from 20 May 2024: 20 km/h, 400 W, 25 kg, 200 mm wheels, age 16; FireFighter: 250 mm cube, 50 mm stroke, 500 mL, 1 m, aluminium plate, punch/shear/saw/file/bend). About 75% of manufacturing cost is committed by the end of the conceptual phase, so the PDS week is the cheapest one in the project.</p>

<h3>3. The twelve headings</h3>
<div class="tbl"><table class="data">
<tr><th>#</th><th>Heading</th><th>E-scooter example (testable)</th></tr>
<tr><td>1</td><td>Introduction</td><td>Folding e-scooter for a 3–8 km Dublin commute, carried onto bus/train</td></tr>
<tr><td>2</td><td>Functional performance</td><td>≤ 20 km/h, ≤ 400 W, ≥ 20 km range at 75 kg, fold ≤ 5 s one-handed, ≤ 25 kg</td></tr>
<tr><td>3</td><td>Operating environment</td><td>−5 to +35 °C, rain, IPX5, 60 mm kerbs, tram rails, salt</td></tr>
<tr><td>4</td><td>Economics</td><td>Retail ≤ €650, BOM ≤ €230, 25,000/yr, spares 7 years</td></tr>
<tr><td>5</td><td>Geometric limitations</td><td>Folded ≤ 1150 × 520 × 530 mm, wheels ≥ 200 mm</td></tr>
<tr><td>6</td><td>Maintenance & repair</td><td>Brake pads with one 4 mm hex key in ≤ 10 min</td></tr>
<tr><td>7</td><td>Reliability</td><td>20,000 fold cycles; frame 100,000 cycles at 100 kg</td></tr>
<tr><td>8</td><td>Safety</td><td>EN 17128, two brakes, ≤ 4.0 m stop from 20 km/h</td></tr>
<tr><td>9</td><td>Sustainability / pollution</td><td>≤ 65 dB(A), removable battery, ≥ 80% recyclable</td></tr>
<tr><td>10</td><td>Ease of use</td><td>One hand, no tools, ≤ 5 s</td></tr>
<tr><td>11</td><td>Human factors</td><td>Carried mass ≤ 13 kg; grip 30–40 mm; 5th %ile female to 95th %ile male</td></tr>
<tr><td>12</td><td>Appearance</td><td>Matte anodised, no exposed deck fasteners</td></tr>
</table></div>
<p>Every heading gets a number or an explicit "not applicable, because ...". A blank heading is an unmade decision. The PDS says <b>what</b> the device must achieve, never <b>how</b> (no mention of the folding mechanism).</p>

<h3>4. Principle 1: write constraints first, because they contradict</h3>
<p>Heading 2 allows 25 kg (the legal limit) but heading 11 says 13 kg (HSE guideline ~10 kg held at arm's length, one-handed, up stairs). Writing them down early is how you find the conflict; the design target becomes ~13 kg.</p>`,
formulas: [],
questions: [
 {src:"Practice (Claude)", see:[2,3], q:R`Rewrite these FireFighter "requirements" as testable PDS lines: (a) "it should be fast"; (b) "it shouldn't spill much"; (c) "it must be light"; (d) "it must be small".`,
  hint:"A number and a test for each. (d) is already fixed by the brief.",
  sol:R`<ul><li>(a) Functional performance: climbs the 1 m competition ladder in ≤ <i>t</i> s (your team's target), measured from start signal to top rung.</li>
  <li>(b) Functional performance: loses ≤ <i>V</i> mL of the 500 mL over a full climb (weigh beaker before and after).</li>
  <li>(c) Functional performance / economics: total mass ≤ <i>m</i> g excluding the water (scales).</li>
  <li>(d) Geometric limitations: stays within a 250 mm cube at every stage of the cycle (check in the SW motion study).</li></ul><p>The targets are the team's to set and defend; what matters is that each can be passed or failed.</p>`,
  ans:"A number + a test for each", prov:"Worked by Claude from the Lecture 2 method."},
 {src:"Practice (Claude)", see:[3], q:R`Is "the gripper uses a spring-loaded hook" a good PDS line? What heading would the underlying need go under?`,
  hint:"What vs how.",
  sol:R`<p>No: it says <i>how</i>, which belongs to concept generation. The need is functional performance / reliability: e.g. "holds the device on a 12 mm × 3 mm rung under the full load with zero slip over 20 consecutive cycles".</p>`,
  ans:"No — it's a solution, not a requirement", prov:"Worked by Claude from Lecture 2."}
],
traps: [
 "A PDS line must be testable: a number, not an adjective.",
 "A PDS says WHAT, never HOW.",
 "Don't leave a heading blank: give a number or 'not applicable, because ...'.",
 "Agree the PDS as a whole team before anyone draws concepts."
]
});

T.topics.push({
id: "selection", part: "Design method", title: "Functions, Morphological Charts & Weighted Matrices",
lectures: "Lecture 2 – Product Design Specifications (parts 2–3); Design Presentation Rubric", status: "lectured",
summary: "Decomposing the device into verb-plus-object functions, generating options with a morphological chart, selecting with a weighted matrix whose criteria come from the PDS, sensitivity-checking the weights, and what the week 5–6 design review is marked on.",
theory: R`
<h3>0. Principle 2: decompose before you conceptualise</h3>
<p>Nobody designs "a scooter": you design functions that must cooperate, each written as <b>verb + object</b> (carry the rider, slow the vehicle, lock the fold ...). You can't brainstorm "a robot", but you can brainstorm "how to grip a rung". Aim for six to ten functions. If two team members' lists differ, someone is hiding an assumption.</p>

<h3>1. Morphological chart</h3>
<p>One row per function, several options per row; read across to build a complete concept. Five functions with four options each give $4^5 = 1024$ combinations: the chart makes sure the three you evaluate are genuinely different.</p>
<div class="tbl"><table class="data">
<tr><th>Function</th><th>Option A</th><th>Option B</th><th>Option C</th></tr>
<tr><td>Lock the fold</td><td>Cam-over lever</td><td>Screw collar</td><td>Spring-loaded pin</td></tr>
<tr><td>Release the fold</td><td>Squeeze trigger</td><td>Foot lever</td><td>Pull pin</td></tr>
<tr><td>Be carried</td><td>Stem as handle</td><td>Dedicated handle</td><td>Shoulder strap</td></tr>
</table></div>

<h3>2. Weighted matrix</h3>
<p>Criteria come from PDS headings; weights are agreed <b>before</b> anyone scores; scores 1–5; total = Σ score × weight.</p>
<div class="tbl"><table class="data">
<tr><th>Criterion (PDS)</th><th>Wt</th><th>Cam-over</th><th>Screw collar</th><th>Spring pin</th></tr>
<tr><td>Can't release under load (8)</td><td>5</td><td>4 (20)</td><td>5 (25)</td><td>3 (15)</td></tr>
<tr><td>20,000 cycles (7)</td><td>4</td><td>3 (12)</td><td>5 (20)</td><td>4 (16)</td></tr>
<tr><td>One hand in 5 s (10)</td><td>3</td><td>5 (15)</td><td>1 (3)</td><td>4 (12)</td></tr>
<tr><td>≤ 250 g added (11)</td><td>3</td><td>4 (12)</td><td>5 (15)</td><td>3 (9)</td></tr>
<tr><td>Makeable (4)</td><td>2</td><td>4 (8)</td><td>5 (10)</td><td>3 (6)</td></tr>
<tr><td><b>Total</b></td><td></td><td>67</td><td><b>73</b></td><td>58</td></tr>
</table></div>

<h3>3. Principle 3: a choice you can't defend is a choice you didn't make</h3>
<p>Raise "one hand, in 5 s" from weight 3 to 5 and the totals become 77 / 75 / 66: the winner flips. Run this <b>sensitivity check</b> on every matrix: if one unjustified weight flips the result, you haven't decided, you've guessed. Write the reason for every weight.</p>
<p>Consequence: in March 2025 Segway recalled 220,000 Ninebot scooters (68 incidents, 20 injuries) because the folding mechanism could collapse. "Lock the fold" had been under-weighted somewhere.</p>
<p>The thread you'll defend: Brief → PDS → Functions → Concepts → Matrix → Detail → Build.</p>

<h3>4. Design review (weeks 5–6, 20%)</h3>
<p>12-minute slot (≈ 9 min talk + 3 min questions); PowerPoint submitted on Loop at the start of your presentation week.</p>
<div class="tbl"><table class="data">
<tr><th>Criterion</th><th>Marks</th><th>For "excellent"</th></tr>
<tr><td>Climbing mechanism</td><td>20</td><td>Three clearly different concepts; well-justified matrix; chosen design fits ladder and actuator; in SW CAD</td></tr>
<tr><td>Gripper</td><td>15</td><td>Three distinct workable designs; justified selection; rung interaction shown in CAD</td></tr>
<tr><td>Stabilising system</td><td>15</td><td>Two or more concepts; stability and friction explained; compatible with the climbing motion</td></tr>
<tr><td>Spring & damping</td><td>15</td><td>Two or more arrangements; justified criteria; practically integrated in CAD</td></tr>
<tr><td>Complete SW assembly</td><td>25</td><td>All subsystems working together; interfaces, motion, clearances and constraints addressed</td></tr>
<tr><td>Teamwork & questions</td><td>10</td><td>Balanced contribution, on time, confident accurate answers</td></tr>
</table></div>`,
formulas: [
 {name:"Weighted total", tex:R`\text{Total} = \sum_i w_i s_i`},
 {name:"Combinations", tex:R`N = \prod_i n_i`, note:"options per function multiplied"}
],
questions: [
 {src:"Lecture 2 exercise", see:[0], q:R`Write the FireFighter device's functions as verb + object (six to ten).`,
  hint:"Think about each moment of a climb cycle, and the water.",
  sol:R`<p>One possible list: <i>grip the rung</i>; <i>release the rung</i>; <i>lift the body</i> (one pitch per cycle); <i>hold position</i> while the other end moves; <i>keep the device aligned</i> to the ladder; <i>support the beaker</i>; <i>isolate the beaker from vibration</i>; <i>sense end of stroke</i>; <i>switch the valve</i>; <i>stop at the top</i>.</p><p>Compare with a teammate: differences reveal hidden assumptions (e.g. does "lift" happen on extension or retraction?).</p>`,
  ans:"e.g. grip rung, release rung, lift body, stay aligned, support beaker, isolate vibration, sense stroke end, switch valve", prov:"Lecture 2 exercise; example answer by Claude."},
 {src:"Lecture 2 example", see:[2,3], q:R`Using the lock-the-fold matrix, recompute the totals with "One hand in 5 s" weighted 5 instead of 3. What does this tell you?`,
  hint:"Only that row changes: add 2 × its score to each total.",
  sol:R`<p>Cam-over: 67 + 2(5) = <b>77</b>. Screw collar: 73 + 2(1) = 75. Spring pin: 58 + 2(4) = 66. The winner flips from screw collar to cam-over lever: the decision rests on one weight, so that weight needs a written justification (and a sensitivity check belongs in the portfolio).</p>`,
  ans:"77 / 75 / 66 — winner flips", prov:"Lecture 2 example."},
 {src:"Practice (Claude)", see:[2,3], q:R`Three gripper concepts scored 1–5 against: no slip on a 12 mm rung (wt 5), release time (wt 3), mass (wt 2), makeable with our processes (wt 4). Hook: 4, 5, 4, 5. Clamp jaw: 5, 2, 3, 3. Printed latch: 3, 4, 5, 2. Which wins, and is it robust to dropping "makeable" to weight 2?`,
  hint:"Σ w × s, then repeat with the changed weight.",
  sol:R`<p>Hook 20 + 15 + 8 + 20 = <b>63</b>; clamp 25 + 6 + 6 + 12 = 49; latch 15 + 12 + 10 + 8 = 45.</p><p>With makeable at 2: hook 53, clamp 43, latch 41. The hook still wins comfortably, so the choice is robust to that weight.</p>`,
  ans:"Hook (63); still wins (53)", prov:"Made-up scores by Claude to practise the method."}
],
traps: [
 "Agree criteria and weights BEFORE scoring.",
