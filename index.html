T.topics.push({
id: "systems", part: "Signal processing", title: "Systems Analysis: Frequency Response & Convolution",
lectures: "Not yet lectured · built from tutorial sheet & past papers", status: "pending",
summary: "How a linear system changes a signal: the frequency response function H(ω) from an ODE or a circuit, gain and phase at a frequency, −3 dB bandwidth, the impulse response, and convolution of sampled signals.",
theory: R`
<div class="callout warn">Lectures not yet released. Built from tutorial Q31–Q35 and past papers.</div>
<h3>1. Linear systems keep frequency</h3>
<p>A sinusoid into a linear system comes out as a sinusoid of the <b>same frequency</b>, scaled in amplitude and shifted in phase. Describing a system means saying how much it scales and shifts each frequency.</p>

<h3>2. Frequency response function</h3>
$$H(\omega) = \frac{Y(\omega)}{X(\omega)}\qquad\Longleftrightarrow\qquad Y(\omega) = H(\omega)X(\omega)$$
<p><b>From an ODE:</b> Fourier-transform both sides; each $d/dt$ becomes $j\omega$. E.g. $y + 2\dfrac{dy}{dt} = 3x$ → $Y(1+2j\omega) = 3X$ → $H = \dfrac{3}{1+2j\omega}$.</p>
<p><b>From a circuit:</b> use impedances $Z_R = R$, $Z_L = j\omega L$, $Z_C = 1/j\omega C$ and the voltage-divider rule.</p>
<p><b>At a particular frequency</b> substitute ω and find:</p>
<ul><li><b>Gain</b> $|H(\omega)|$: output amplitude / input amplitude.</li><li><b>Phase</b> $\angle H(\omega)$: angle of numerator − angle of denominator.</li></ul>
<div class="callout key"><b>First-order low-pass</b> $H = \dfrac{K}{1+j\omega\tau}$: $|H| = K/\sqrt{1+\omega^2\tau^2}$, phase $= -\tan^{-1}\omega\tau$. −3 dB when $\omega\tau = 1$: <b>bandwidth $\omega_c = 1/\tau$</b>, where gain is $K/\sqrt2$ and phase −45°.</div>

<h3>3. Impulse response</h3>
<p>The impulse response $h(t)$ is the output when the input is a unit impulse $\delta(t)$. Since an impulse contains all frequencies equally ($\delta\leftrightarrow1$), $h(t)$ and $H(\omega)$ are a Fourier-transform pair. Find it by hitting the system with a short sharp input (e.g. a hammer tap) and recording the output, or by inverse-transforming $H(\omega)$.</p>

<h3>4. Convolution: output in the time domain</h3>
<p>Treat the input as a string of impulses; each produces a scaled, delayed copy of $h$, and the output is their sum:</p>
$$y(t) = \int_{0}^{t}h(\tau)\,x(t-\tau)\,d\tau \qquad\text{sampled: } y_n = \sum_k h_k\,x_{n-k}$$
<p>Convolution in time ⇔ multiplication in frequency ($Y = HX$).</p>
<ol class="steps"><li>Write $h_0, h_1, h_2,\dots$ and $x_0, x_1,\dots$</li><li>For each output index n, multiply every pair whose indices add to n and sum them (flip-and-slide).</li><li>The output lasts (length of x) + (length of h) − 1 samples.</li><li>For a constant input, the output is steady once the whole of h overlaps the input: steady value = input × sum of $h$. After the input stops, it takes (length of h − 1) samples to die away.</li></ol>`,
formulas: [
 {name:"Frequency response", tex:R`H(\omega)=\frac{Y(\omega)}{X(\omega)}`},
 {name:"ODE → H(ω)", tex:R`\frac{d}{dt}\ \to\ j\omega`},
 {name:"Impedances", tex:R`Z_R=R,\ \ Z_L=j\omega L,\ \ Z_C=\frac1{j\omega C}`},
 {name:"Gain and phase", tex:R`|H|=\frac{|N|}{|D|},\quad \angle H=\angle N-\angle D`},
 {name:"First-order bandwidth", tex:R`H=\frac{K}{1+j\omega\tau}\Rightarrow\omega_c=\frac1\tau`},
 {name:"Convolution", tex:R`y(t)=\int_0^t h(\tau)x(t-\tau)d\tau,\qquad y_n=\sum_kh_kx_{n-k}`}
],
questions: [
 {src:"Tutorial Q31 & Q33", q:R`A system obeys $y + 2\dfrac{dy}{dt} = 3x$. (Q31) How is a 4 rad/s signal altered? (Q33) What is the bandwidth (−3 dB point)?`,
  sol:R`<p>$H(\omega) = \dfrac{3}{1+2j\omega}$. At ω = 4: $H = \dfrac{3}{1+8j}$, $|H| = 3/\sqrt{65} = 0.372$, phase $= -\tan^{-1}8 = -82.9° = -1.446$ rad. The signal is multiplied by 0.372 and lags by 82.9°.</p>
  <p>Bandwidth: $|H| = 3/\sqrt2$ when $2\omega = 1$ → $\omega_c = 0.5$ rad/s.</p>
  <p class="small">The sheet gives √17/2 rad/s for Q33, which doesn't follow from this equation (it may belong to another version of Q31). 0.5 rad/s is what this system gives.</p>`, ans:"×0.372, lag 82.9°; 0.5 rad/s"},
 {src:"Tutorial Q32", q:R`Series R, L, C driven by $V_i$. Find the frequency response with output across the inductor.`,
  sol:R`Current $I = \dfrac{V_i}{R + j\omega L + 1/j\omega C}$; $V_L = j\omega L\,I$.
  $$H(\omega) = \frac{j\omega L}{R + j\omega L + \frac{1}{j\omega C}} = \frac{-\omega^2LC}{1-\omega^2LC + j\omega RC}$$
  (multiply top and bottom by $j\omega C$). It's high-pass: 0 at ω = 0, → 1 at high ω.`},
 {src:"2025 Exam, Q2 (30 marks)", q:R`(a) What is the frequency response function and how is it found from $X(\omega)$ and $Y(\omega)$? (b) What is the impulse response and how can it be found? (c) How is the output calculated in the time domain from $x(t)$ and $h(t)$? (d) Why sample signals? (e) Impulse response $h^*$: 1 at t = 0, 2 at the next sample. Input $x^*$: 2 at the first two samples after t = 0. Find $y^*$ for the first 5 samples and sketch it.`,
  hint:"Read the figure carefully; the values below are my reading of it.",
  sol:R`<p><b>(a)</b> $H(\omega)$ gives the gain and phase change the system applies at each frequency; $H = Y(\omega)/X(\omega)$, the ratio of output and input spectra.</p>
  <p><b>(b)</b> $h(t)$ is the output when the input is a unit impulse. Found experimentally by applying a short sharp input and recording the response, or as the inverse Fourier transform of $H(\omega)$.</p>
  <p><b>(c)</b> Convolution: $y(t) = \int h(\tau)x(t-\tau)d\tau$. Each slice of the input acts as an impulse producing a scaled, delayed copy of $h$; summing them gives $y$.</p>
  <p><b>(d)</b> To store and process data digitally (computers, FFT).</p>
  <p><b>(e)</b> With $h = [1, 2]$ (at t = 0, 1) and $x = [0, 2, 2]$ (at t = 0, 1, 2):
  $y_0 = 0$; $y_1 = h_0x_1 = 2$; $y_2 = h_0x_2 + h_1x_1 = 2+4 = 6$; $y_3 = h_1x_2 = 4$; $y_4 = 0$. So $y^* = 0, 2, 6, 4, 0$.</p>`},
 {src:"Tutorial Q34", q:R`Impulse response $h^*$ ≈ 1, 2, 1 (three samples) and a constant input of height 2 that starts at t = 0 and later stops. Sketch the output, say when it settles and how many nonzero values follow the input stopping.`,
  sol:R`<p>Building up: $2\times1 = 2$, then $2(1+2) = 6$, then $2(1+2+1) = 8$, then 8 steady while the whole of h overlaps the input. Steady value = 2 × Σh = 8.</p>
  <p>After the input stops: $2(2+1) = 6$, then $2(1) = 2$, then 0: <b>two</b> nonzero values after the input ceases (length of h − 1).</p>
  <p class="small">The answer key says it settles 4 samples after the input starts; that counts from the t = 0 sample in the figure. The pattern 2, 6, 8, 8, … is the important part.</p>`},
 {src:"2022 Exam, Q2 b–d", q:R`Input spectrum $\dfrac{0.5}{1+j\omega}$, output $\dfrac{1}{(1+j\omega)(1+3j\omega)}$. (b) How do you compute the FRF? (c) Find it and the −3 dB point. (d) What type of filter is it and could it be an anti-aliasing filter?`,
  sol:R`<p><b>(b)</b> $H = Y/X$.</p><p><b>(c)</b> $H = \dfrac{1}{(1+j\omega)(1+3j\omega)}\cdot\dfrac{1+j\omega}{0.5} = \dfrac{2}{1+3j\omega}$. −3 dB at $3\omega = 1$: $\omega_c = 1/3$ rad/s.</p>
  <p><b>(d)</b> First-order low-pass. In principle yes (it removes high frequencies before sampling), but its roll-off is gentle (−20 dB/decade), so it would only work if the sampling frequency is well above 2 × 1/3 rad/s; a sharper higher-order filter is preferable.</p>`, ans:"2/(1+3jω); 1/3 rad/s"},
 {src:"2023 Resit, Q2 d–e", q:R`$H(\omega) = \dfrac{1}{1+4j\omega}$. (d) Bandwidth? (e) Gain and phase at the cut-off?`,
  sol:R`(d) $4\omega = 1$ → $\omega_c = 0.25$ rad/s. (e) $|H| = 1/\sqrt2 = 0.707$ (−3 dB), phase $= -\tan^{-1}1 = -45° = -\pi/4$.`},
 {src:"MCQ · several years", q:R`(i) For a linear system, which is true: same amplitude, same phase, same frequency, no relation? (ii) $H = \dfrac{2}{4-(j\omega)^2}$, input $X = 2+j\omega$: output? (iii) $X = 1-(j\omega)^2$, $Y = 1-j\omega$: H at 3 rad/s? (iv) $H = \dfrac{1}{1+3j\omega}$: −3 dB frequency? (v) Unit-amplitude 2 rad/s signal through $H = \dfrac{1}{4+2j\omega}$: amplitude and phase change?`,
  sol:R`<p>(i) Same frequency.</p>
  <p>(ii) $Y = \dfrac{2(2+j\omega)}{4-(j\omega)^2} = \dfrac{4+2j\omega}{4-(j\omega)^2}$. Since $4-(j\omega)^2 = (2+j\omega)(2-j\omega)$ this also equals $\dfrac{2}{2-j\omega}$. <span class="small">On the 2025 paper both of those forms are options; pick the one that matches the 2024 key, $(4+2j\omega)/(4-(j\omega)^2)$, and mention the simplification if there's space.</span></p>
  <p>(iii) $H = \dfrac{1-j\omega}{(1-j\omega)(1+j\omega)} = \dfrac{1}{1+j\omega}$ → $\dfrac{1}{1+3j}$.</p>
  <p>(iv) 1/3 rad/s.</p>
  <p>(v) $H(2) = \dfrac{1}{4+4j}$: amplitude $\dfrac{1}{4\sqrt2}$, phase $-\pi/4$.</p>`}
],
traps: ["(jω)² = −ω², so 4 − (jω)² = 4 + ω².", "Bandwidth of K/(1 + jωτ) is 1/τ rad/s; convert to Hz only if asked.", "Phase of 1/(a + jb) is −tan⁻¹(b/a): the minus sign comes from being in the denominator."]
});

<h3>0. What data analytics is for</h3>
<p>Separating signal from noise to make useful predictions. Four components: generation, storage, retrieval, analysis. Four types:</p>
<div class="tbl"><table class="data">
<tr><th>Type</th><th>Question</th></tr>
<tr><td>Descriptive</td><td>What happened? (sales up this month?)</td></tr>
<tr><td>Diagnostic</td><td>Why did it happen? (did the weather affect sales?)</td></tr>
<tr><td>Predictive</td><td>What is likely to happen next?</td></tr>
<tr><td>Prescriptive</td><td>What should we do about it?</td></tr>
</table></div>
<p>Techniques named: regression, factor analysis, cohort analysis, Monte Carlo simulation, time-series analysis.</p>

<h3>1. R, packages and the working directory</h3>
<p>Base R is all you need (one-line commands); RStudio adds an editor, history and plot pane. Packages come from CRAN:</p>
<pre>install.packages("dplyr")   # once (quotes!)
library(dplyr)              # every session

<div class="tbl"><table class="data">

<tr><td>Excel</td><td><code>library(readxl); read_excel("x.xls")</code></td></tr>
<tr><td>XML</td><td><code>library(XML); xmlParse(file = "x.xml")</code></td></tr>
</table></div>
<p>Built-in datasets: <code>data()</code> lists them (iris, mtcars, airquality, women, cars, AirPassengers, ...).</p>

<h3>3. Data types and structures</h3>
<ul>
<li>Types: character <code>"25"</code>, numeric <code>12</code>, integer <code>30L</code>, complex <code>5+6i</code>, logical <code>TRUE/FALSE</code>. Check with <code>class(x)</code>.</li>

<p>First look at any dataset: <code>class</code>, <code>names</code>, <code>head</code>/<code>tail</code>, <code>dim</code>, <code>str</code>, <code>summary</code>.</p>`,

T.topics.push({
id: "summary", part: "Describing data", title: "Summary Statistics, Missing Data & Outliers",
lectures: "Lecture 2; Tutorial 3", status: "lectured",
summary: "Every numerical column needs three things: a typical value, a spread and a frequency plot. Mean vs median, standard deviation and coefficient of variation, quantiles and the IQR, confidence intervals for the DATA, density plots, bar charts, boxplots and outliers, and handling NAs.",
theory: R`
<h3>0. Visualise first</h3>
<p><code>plot(iris)</code> gives every pairwise scatterplot. With a factor, ggplot2 shows how each level affects a numerical variable:</p>
<pre>library(ggplot2)
ggplot(iris) + aes(x = Species, y = Sepal.Width, color = Species) +
  geom_jitter() + theme(legend.position = "none")</pre>
<p><code>geom_jitter()</code> spreads points sideways so they don't overlap; <code>theme()</code> removes the pointless legend.</p>

<h3>1. The typical value</h3>
<p>Mean $\bar x = \sum x / n$ (the default). Median: the middle value, <b>robust</b> to outliers; use it when there are outliers (income, Airbnb prices). Mode: rarely useful.</p>
<p>If mean ≈ median there are probably no outliers; if mean ≫ median the data are right-skewed / have large outliers.</p>
<pre>summary(iris)                     # min, quartiles, median, mean, NA count
apply(iris[1:4], 2, mean)         # 2 = columns, 1 = rows
sapply(d, sd)                     # per column
mean(iris$Sepal.Width)</pre>

<h3>2. Spread</h3>
<p>Sample standard deviation (what R's <code>sd()</code> uses):</p>
$$s = \sqrt{\frac{\sum(x - \bar x)^2}{n-1}}$$
<p>It measures <b>consistency</b> (manufacturing tolerances). Two datasets can share mean and median yet differ wildly in spread (18 19 20 20 20 21 22 vs 1 1 1 20 39 39 39). Divide by $n$ only for a complete population (never in practice).</p>
<p><b>Coefficient of variation</b> compares spread relative to the mean: $CV = s/\bar x \times 100\%$.</p>
<p>With the median, use the <b>interquartile range</b> $IQR = Q_3 - Q_1$ (<code>IQR(x)</code>).</p>

<h3>3. Quantiles and the confidence interval for the data</h3>
<pre>quantile(x)                    # 0, 25, 50, 75, 100 %
quantile(x, 0.25)              # value below which 25% lie
quantile(x, c(0.05, 0.95))     # 90% of the DATA lies between these
range(x)</pre>
<p>"95% confidence interval for [a variable]" with no mention of the mean = <code>quantile(x, c(0.025, 0.975))</code>. This is a range for the data (wide), not for the mean (narrow, see Inference).</p>

<h3>4. Frequency plots</h3>
<ul>
<li><b>Continuous</b> (many possible values, > ~10): kernel density, <code>plot(density(x))</code>. Same mean and sd can hide very different shapes, so always plot.</li>
<li><b>Discrete</b> (few values): <code>barplot(table(mtcars$cyl))</code>.</li>
</ul>

<h3>5. Boxplots and outliers</h3>
<p>Box from $Q_1$ to $Q_3$ with the median inside; whiskers reach the most extreme data points within $1.5\times IQR$ of the box; anything beyond is plotted as an outlier.</p>
<pre>boxplot(subset(iris, Species == "setosa")$Sepal.Width)
boxplot(price ~ room_type, data = ny)</pre>
<p><b>True</b> outliers (natural variation) stay; <b>systematic</b> ones (measurement, entry or sampling errors) are investigated and possibly removed.</p>

<h3>6. Missing data (NA)</h3>
<pre>mean(airquality$Ozone)               # NA
mean(airquality$Ozone, na.rm = TRUE) # 42.13
colSums(is.na(d))                    # NAs per column
rowSums(is.na(d))                    # NAs per row: spot collection failures
aqc &lt;- na.omit(airquality)          # drops 42 of 153 rows</pre>
<p><code>na.omit</code> drops the whole row, so means of other columns change too (Ozone 42.10 instead of 42.13). It assumes the dropped rows are typical; check for a pattern first. A column with many NAs suggests a collection problem.</p>`,
formulas: [
 {name:"Mean", tex:R`\bar x = \frac{\sum x}{n}`},
 {name:"Sample sd", tex:R`s = \sqrt{\frac{\sum (x-\bar x)^2}{n-1}}`},
 {name:"Coefficient of variation", tex:R`CV = \frac{s}{\bar x}\times 100\%`},
 {name:"Interquartile range", tex:R`IQR = Q_3 - Q_1`},
 {name:"Boxplot whiskers", tex:R`Q_1 - 1.5\,IQR,\ \ Q_3 + 1.5\,IQR`}
],
questions: [
 {src:"Lecture 2 example", see:[2], q:R`Imperfections per sheet for two processes: P1 = 13 11 13 15 12 14 12 15 11 13; P2 = 13 19 13 14 13 20 12 13 15 10. Which process is better?`,
  hint:"Compare mean, sd and CV.",
  sol:R`<p>P1: $\bar x$ = 12.9, $s$ = 1.45, CV = 11.2%. P2: $\bar x$ = 14.2, $s$ = 3.08, CV = 21.7%.</p><p>P1 has fewer imperfections and is more consistent, even relative to its mean. (Strictly, decisions shouldn't rest on point estimates alone: that comes later with confidence intervals.)</p>`,

T.topics.push({
id: "factors", part: "Relationships", title: "Subsetting, Contingency Tables & Bayes' Theorem",
lectures: "Lecture 3; Tutorials 4–5", status: "lectured",
summary: "Subsetting rows and columns in base R and dplyr, two-way tables and which proportion a question wants (joint, row or column), conditional probability and Bayes' theorem, Simpson's paradox, and summarising a number by a factor with by(), tapply() and aggregate().",
theory: R`
<h3>0. Three kinds of relationship</h3>
<ol><li>One factor and one number: summaries per factor level.</li>
<li>Two factors: tables, proportions, probability.</li>
<li>Two numbers: scatterplots, correlation and regression.</li></ol>
<p>Factors are often coded as integers (framingham: <code>male</code> 1/0, <code>currentSmoker</code>, <code>BPMeds</code>).</p>

<h3>1. Subsetting</h3>
<div class="tbl"><table class="data">
<tr><th>Want</th><th>Code</th></tr>
<tr><td>Columns by number or name</td><td><code>iris[c(1,3,5)]</code>, <code>d[c("price","room_type")]</code></td></tr>
<tr><td>Rows for one level</td><td><code>subset(iris, Species == "setosa")</code></td></tr>
<tr><td>Two conditions</td><td><code>subset(d, a == "x" &amp; b > 3)</code> (or <code>|</code>)</td></tr>
<tr><td>Several levels</td><td><code>subset(d, g %in% c("A","B"))</code></td></tr>
<tr><td>Rows and columns</td><td><code>subset(iris, Species == "virginica", select = c(Sepal.Length, Sepal.Width))</code></td></tr>
<tr><td>Drop columns / rows</td><td><code>subset(d, select = -c(id, name))</code>, <code>subset(iris, Species != "setosa")</code></td></tr>
<tr><td>Count matches</td><td><code>nrow(subset(...))</code>, <code>sum(x &lt; 0, na.rm = TRUE)</code></td></tr>
<tr><td>dplyr</td><td><code>d %>% filter(g == "v") %>% select(a, b)</code></td></tr>
</table></div>
<p><code>==</code> not <code>=</code>; text levels need quotes and exact spelling (<code>unique(d$g)</code> to check).</p>

<h3>2. Contingency tables and proportions</h3>
<pre>t &lt;- table(fram$male, fram$currentSmoker)   # 1st = rows, 2nd = columns
addmargins(t)          # totals
prop.table(t)          # JOINT:   P(A and B)
prop.table(t, 1)       # ROWS:    P(column level | row level)
prop.table(t, 2)       # COLUMNS: P(row level | column level)
mosaicplot(t)</pre>
<p><b>Decoder:</b> the group after "of / from / given / among / for a ..." is the condition. Put it in the rows and use <code>prop.table(t, 1)</code>. "Proportion of all listings that are A and B" is joint.</p>

<h3>3. Probability and Bayes' theorem</h3>
$$P(E) = \frac{\text{number of data values of interest}}{\text{total number of data values}}$$
<p>Conditional probability restricts the denominator to a subset: $P(S\mid M)$ = smokers among males. Proportions describe the past; probability uses the same numbers to predict.</p>
$$P(A \text{ and } B) = P(A\mid B)P(B) = P(B\mid A)P(A)\quad\Rightarrow\quad P(A\mid B) = \frac{P(B\mid A)P(A)}{P(B)}$$

<h3>4. Simpson's paradox</h3>
<p>A trend in combined data can vanish or reverse in subgroups. Berkeley admissions: pooled, men 44.5% vs women 30.4% admitted; but in most departments women did as well or better (Dept A: women 82%, men 62%). Women applied mainly to departments with low admission rates. Always ask whether a third factor is lurking.</p>
<pre>margin.table(UCBAdmissions, c(1, 2))
prop.table(UCBAdmissions[, , "A"], 2)</pre>

<h3>5. A number by a factor</h3>
<pre>by(fh$sysBP, fh$education, median)
tapply(d$y, d$g, mean, na.rm = TRUE)
aggregate(price ~ neighbourhood_group + room_type, data = ny, FUN = mean)
by(ny$price, ny$neighbourhood_group, quantile, c(.025, .975))
sapply(S[c("PRES","DEWP","TEMP")], sd, na.rm = TRUE)</pre>`,
formulas: [
 {name:"Probability", tex:R`P(E) = \frac{\#\text{ of interest}}{\#\text{ total}}`},
 {name:"Bayes", tex:R`P(A\cap B) = P(A\mid B)P(B) = P(B\mid A)P(A)`},
 {name:"Conditional", tex:R`P(A\mid B) = \frac{P(A\cap B)}{P(B)}`}
],

T.topics.push({
id: "probability", part: "Relationships", title: "Random Variables & the Normal Model",
lectures: "Lecture 4", status: "lectured",
summary: "Discrete and continuous random variables, the probability mass function, density curves, probabilities by counting, pnorm and qnorm for approximately normal data, the inverse problem, and Q-Q plots to check normality.",
theory: R`
<h3>0. Random variables</h3>
<p>Think of a random variable as a measurement, or a column of a database. <b>Discrete</b>: few possible values (≤ ~10), usually integers (mtcars cyl, gear, carb). <b>Continuous</b>: many possible values (mpg, wt; hp and disp are integers but have many values, so count as continuous).</p>

<h3>1. Discrete: the probability mass function</h3>
<pre>prop.table(table(mtcars$gear))   # 3: 0.469, 4: 0.375, 5: 0.156
barplot(table(mtcars$gear))</pre>
<p>Probabilities of combined events add: P(fewer than 6 cylinders) = P(4).</p>

<h3>2. Continuous: density and counting</h3>
<p><code>plot(density(x))</code> is the probability density function $f(x)$; area under it between $a$ and $b$ is $P(a &lt; X &lt; b)$. In practice just count:</p>
<pre>mean(mtcars$wt > 3.18)     # 0.5625
quantile(mtcars$wt, 0.4375)  # inverse: 3.18</pre>

<h3>3. The normal distribution</h3>
<p>Bell-shaped; described fully by mean and sd: $X \approx N(\mu, \sigma)$. Setosa sepal length ≈ N(5.006, 0.352). Not everything is normal (Airbnb price is hugely skewed).</p>
<div class="tbl"><table class="data">
<tr><th>Want</th><th>Code</th></tr>
<tr><td>P(X &lt; A)</td><td><code>pnorm(A, m, s)</code></td></tr>
<tr><td>P(X > A)</td><td><code>1 - pnorm(A, m, s)</code></td></tr>
<tr><td>P(A &lt; X &lt; B)</td><td><code>pnorm(B, m, s) - pnorm(A, m, s)</code></td></tr>
<tr><td>Value below which p lie</td><td><code>qnorm(p, m, s)</code> (normal) or <code>quantile(x, p)</code> (data)</td></tr>
<tr><td>Value exceeded p of the time</td><td><code>qnorm(1 - p, m, s)</code></td></tr>
</table></div>
<p>Counting gives the exact proportion in the data; <code>pnorm</code> is an approximation that assumes normality. If the question says "approximately normally distributed", use <code>pnorm</code>/<code>qnorm</code> with the sample mean and sd.</p>

<h3>4. Checking normality</h3>
<pre>qqnorm(x); qqline(x)</pre>
<p>Points close to the line, with no systematic curve away from it: normal. Also look at <code>plot(density(x))</code>.</p>`,
formulas: [
 {name:"Below A", tex:R`P(X<A) = \texttt{pnorm(A, m, s)}`},
 {name:"Above A", tex:R`P(X>A) = 1-\texttt{pnorm(A, m, s)}`},
 {name:"Inverse", tex:R`x_p = \texttt{qnorm(p, m, s)}`},
 {name:"Standardise", tex:R`Z = \frac{X-\mu}{\sigma}`}
],
questions: [
 {src:"Lecture 4 example", see:[3], q:R`Setosa sepal length ≈ N(5.006, 0.352). Find P(length &lt; 5.4) by counting and by the normal model, and the value below which 33.33% of lengths lie.`,
  hint:"sum(x < 5.4)/length(x) vs pnorm; quantile vs qnorm.",
  sol:R`<pre>set_data &lt;- subset(iris, Species == "setosa")
mean(set_data$Sepal.Length &lt; 5.4)     # 0.8   (exact, from the data)
pnorm(5.4, 5.006, 0.352)               # 0.868 (normal approximation)
quantile(set_data$Sepal.Length, 0.3333) # 4.9
qnorm(0.3333, 5.006, 0.352)            # 4.854</pre>`,
  ans:"0.8 (data) / 0.868 (normal); 4.9 / 4.854", prov:"Lecture 4 example."},
 {src:"Practice (Claude)", see:[3], q:R`With the same model, find P(length > 5.4), P(4.8 &lt; length &lt; 5.2), and the length exceeded by only 10% of setosa flowers.`,
  hint:"1 − pnorm; difference of two pnorms; qnorm(0.9, ...).",
  sol:R`<pre>1 - pnorm(5.4, 5.006, 0.352)                              # 0.132
pnorm(5.2, 5.006, 0.352) - pnorm(4.8, 5.006, 0.352)       # 0.430
qnorm(0.9, 5.006, 0.352)                                  # 5.457</pre>`,
  ans:"0.132; 0.430; 5.46", prov:"Worked by Claude in R."},
 {src:"Quiz 3 (2025) Q10", see:[3], q:R`<code>CompanyABCProfit.csv</code>: Profit is approximately normally distributed. Find the profit exceeded only 10% of the time in the 20th century (1 dp).`,
  hint:"The stem says approximately normal.",
  sol:R`<pre>p20 &lt;- subset(p, Year >= 1901 &amp; Year &lt;= 2000)
qnorm(0.9, mean(p20$Profit), sd(p20$Profit))   # 1639.4
quantile(p20$Profit, 0.9)                      # 1647.8 (marked wrong)</pre><p>If the century is taken as 1900–1999 the same method gives 1657.2.</p>`,
  ans:"1639.4", prov:LOOP+" The raw quantile, 1647.8, was marked wrong, which points to the qnorm answer."},
 {src:"Practice (Claude)", see:[1], q:R`From <code>mtcars$cyl</code>: probability a car has fewer than 6 cylinders, and probability it has 4 or 6.`,
  hint:"prop.table(table()) then add.",
  sol:R`<pre>prop.table(table(mtcars$cyl))   # 4: 0.344, 6: 0.219, 8: 0.438</pre><p>P(&lt; 6) = P(4) = 0.344. P(4 or 6) = 0.344 + 0.219 = 0.563.</p>`,
  ans:"0.344; 0.563", prov:"Lecture 4 question; worked by Claude."}
],
traps: [
 "'Approximately normal' in the question: use pnorm/qnorm with mean() and sd(), not quantile().",
 "No mention of normal: use the data (mean(x < a), quantile).",
 "pnorm gives the LEFT tail. Above a value is 1 − pnorm.",
 "'Exceeded by 10%' is the 90th percentile: qnorm(0.9, ...)."
]
});

T.topics.push({
id: "regression", part: "Relationships", title: "Correlation, Regression & Model Checking",
lectures: "Lecture 5; Tutorial 6; 'How Good Is My Model' slides", status: "lectured",
summary: "Scatterplots first, then the least-squares line with lm(), prediction with predict(), the correlation coefficient and its limits (Anscombe), power-law fits on logs, multiple regression with factors, and judging a model with R², residual diagnostics and actual-vs-fitted plots.",
theory: R`
<h3>0. Look first</h3>
<pre>plot(women$height, women$weight)
plot(airquality)       # all pairwise scatterplots at once</pre>
<p>If a straight line fits by eye the relationship is linear, $y = a + bx$; otherwise non-linear (mercury vapour pressure vs temperature).</p>

<h3>1. The regression line</h3>
<pre>fit &lt;- lm(weight ~ height, data = women)    # y FIRST
coef(fit)                                     # -87.52, 3.45
predict(fit, data.frame(height = 64))         # 133.28
plot(women$height, women$weight); abline(fit, col = "red")</pre>
$$b = \frac{n\sum xy - \sum x\sum y}{n\sum x^2 - (\sum x)^2},\qquad a = \frac{\sum y}{n} - b\frac{\sum x}{n}$$
<p>Only valid within the data range (heights 58–72). "Estimate diaBP for sysBP = 119" means <code>lm(diaBP ~ sysBP)</code>. If a group is named (March only), subset before fitting.</p>

<h3>2. Correlation</h3>
$$r = \frac{n\sum xy - \sum x\sum y}{\sqrt{[n\sum x^2 - (\sum x)^2][n\sum y^2 - (\sum y)^2]}}$$
<p>−1 to +1. About ±0.3 weak, ±0.5 moderate, ±0.7 strong. <code>cor(x, y, use = "complete.obs")</code> with NAs. "Most linear" = largest |r| (−0.9 beats 0.8). women: 0.995; cars: 0.807.</p>
<p>$r$ measures <b>linear</b> fit only: mercury pressure has r = 0.76 yet is clearly curved. <b>Anscombe's quartet</b>: four datasets with the same means, variances, r = 0.816 and line y = 3 + 0.5x, but completely different plots. Always plot. Correlation is not causation.</p>

<h3>3. Non-linear: power laws</h3>
<p>If $\log y$ vs $\log x$ is linear, $\log y = a + b\log x \Leftrightarrow y = e^a x^b$. (If $\log y$ vs $x$ is linear, $y = e^a e^{bx}$, exponential.)</p>
<pre>lv  &lt;- by(log(DNase$density), log(DNase$conc), mean)
vmd &lt;- as.vector(lv); vc &lt;- as.numeric(names(lv))
cor(vc, vmd)                          # 0.992
fit &lt;- lm(vmd ~ vc)                   # -0.8558 + 0.6700 vc
exp(coef(fit)[1])                     # 0.4249  →  d = 0.42 c^0.67</pre>
<p>Always back-transform with <code>exp()</code> before reporting $y$.</p>

<h3>4. Multiple regression and factors</h3>
<pre>lm(Petal.Length ~ Species + Petal.Width, iris)   # factor coded automatically
lm(y ~ x1 * x2, d)       # with interaction
lm(y ~ x + I(x^2), d)    # quadratic
lm(log(y) ~ log(x1), d)  # transformed
lm(y ~ ., d)             # all other columns</pre>
<p>A factor becomes dummy variables: one level (setosa) is the baseline in the intercept; each other level gets its own shift (versicolor +1.70, virginica +2.28 cm, holding width fixed).</p>

<h3>5. How good is the model?</h3>
<ul>
<li><code>summary(fit)</code>: coefficients, $R^2$ (fraction of variance explained; adjusted $R^2$ penalises extra terms), residual standard error, F-statistic. Petal.Width only: R² 0.927; + Species: 0.955, RSE 0.478 → 0.378.</li>
<li><code>plot(fit)</code> diagnostics (<code>which = 1</code> is Residuals vs Fitted): residuals centred on 0 with no curve (linearity), Q-Q close to the line (normal residuals), flat Scale-Location (constant variance), no point with large Cook's distance.</li>
<li>Actual vs fitted plot with the 45° line: points close and evenly scattered = good fit; systematically above or below = underfitting (missing a variable); tiny wiggles = overfitting.</li>
<li><code>checkresiduals(fit)</code> (forecast package): Breusch–Godfrey p &gt; 0.05 means no evidence of autocorrelation in the residuals.</li>
<li><code>predict(fit, newdata, interval = "confidence")</code> is for the mean response; <code>interval = "prediction"</code> is for one new value and is wider.</li>
</ul>`,
formulas: [
 {name:"Line", tex:R`y = a + bx`},
 {name:"Slope", tex:R`b = \frac{n\sum xy-\sum x\sum y}{n\sum x^2-(\sum x)^2}`},
 {name:"Correlation", tex:R`r = \frac{n\sum xy-\sum x\sum y}{\sqrt{[n\sum x^2-(\sum x)^2][n\sum y^2-(\sum y)^2]}}`},
 {name:"Power law", tex:R`\log y = a + b\log x \iff y = e^a x^b`},
 {name:"Exponential", tex:R`\log y = a + bx \iff y = e^a e^{bx}`}
],

  hint:"diaBP is the y.",
  sol:R`<pre>fit &lt;- lm(diaBP ~ sysBP, data = fh)    # diaBP = 26.809 + 0.4238 sysBP

T.topics.push({
id: "timeseries", part: "Relationships", title: "Time Series: Decomposition, Trend & Forecasting",
lectures: "Lecture 6; Tutorial 8", status: "lectured",
summary: "Trend, seasonal and random components; additive vs multiplicative models; decompose(), moving averages and the linear trend; forecasting by hand (AirPassengers January 1961); training/test splits, TSLM and ETS models, accuracy() metrics and checkresiduals().",
theory: R`
<h3>0. Structure</h3>
<p>Many series combine a <b>trend</b> (medium-term), <b>seasonal factors</b> (short-term, e.g. monthly) and <b>random</b> noise. AirPassengers has structure; the Nile series looks random.</p>
<pre>str(AirPassengers); start(AirPassengers); end(AirPassengers)   # 1949 1 to 1960 12</pre>

<h3>1. Additive vs multiplicative</h3>
$$\text{additive: } DATA = T + SF\qquad \text{multiplicative: } DATA = T\times SF$$
<p>Seasonal swings constant in size → additive; growing with the trend → multiplicative (AirPassengers). Ultimately use whichever predicts better.</p>
<pre>da &lt;- decompose(AirPassengers, "multiplicative")
da$figure    # the 12 seasonal factors (Jan 0.910 ... Jul 1.227)
plot(da)</pre>

<h3>2. The trend</h3>
<p><b>Moving averages</b> smooth the series (<code>rollmean(x, 5)</code> in zoo). Odd orders are symmetric. <code>decompose()</code> uses a <b>12-point centred</b> moving average (<code>ma(x, 12, centre = TRUE)</code>), so the first 6 and last 6 months have no trend value.</p>
<p>To predict, approximate the trend with a straight line in $t = 1, 2, \ldots$:</p>
<pre>t &lt;- 1:144
lmAP &lt;- lm(da$trend ~ t)     # LT = 84.648 + 2.667 t</pre>
<p>Seasonal factor (multiplicative) = mean of DATA/TREND for that month over all years. Random = DATA/(T × SF).</p>

<h3>3. Forecasting by hand</h3>
<ol class="steps"><li>Find $t$ for the target period (Jan 1961 = 145).</li>
<li>Trend: $LT = 84.648 + 2.667(145) = 471.35$.</li>
<li>Multiplicative: × SF(Jan) 0.9102 = <b>429.04</b>. (Additive: + SF.)</li></ol>
<pre>trend &lt;- predict(lmAP, data.frame(t = 145:156))
trend * as.vector(da$figure)   # Jan–Dec 1961</pre>
<p>Forecasts carry no random component.</p>

<h3>4. Train/test and model families (Tutorial 8)</h3>
<p>For a time series the test set must be the <b>most recent</b> data (random selection destroys trend and seasonality).</p>
<pre>library(forecast)
train &lt;- window(BJsales, end = 138); test &lt;- window(BJsales, start = 139)
m1 &lt;- tslm(train ~ trend)          # (+ season if seasonal)
m2 &lt;- ets(train)                    # picks e.g. ETS(A,Ad,N)
f1 &lt;- forecast(m1, h = 12); f2 &lt;- forecast(m2, h = 12)   # 80% and 95% prediction intervals
accuracy(f1, test); accuracy(f2, test)
checkresiduals(m2)</pre>
<p><b>ETS</b> = Error, Trend, Seasonality, each N (none), A (additive), M (multiplicative) or damped (Ad). Smoothing parameters α (level), β (trend), γ (season), φ (damping, &lt; 1 flattens the trend). σ is the residual sd: judge it against the range of the data.</p>

<h3>5. Judging a forecast</h3>
<div class="tbl"><table class="data">
<tr><th>Metric</th><th>Meaning</th></tr>
<tr><td>ME</td><td>Average error: bias (positive = under-forecasting)</td></tr>
<tr><td>RMSE, MAE</td><td>Typical error size (RMSE punishes big errors); lower is better</td></tr>
<tr><td>MPE, MAPE</td><td>Percentage versions; unreliable near zero</td></tr>
<tr><td>MASE</td><td>&lt; 1 beats the naïve last-value forecast</td></tr>
<tr><td>ACF1</td><td>Lag-1 autocorrelation of residuals; near 0 is good</td></tr>
<tr><td>Theil's U</td><td>&lt; 1 beats the naïve forecast</td></tr>
</table></div>
<p><code>checkresiduals()</code>: residuals should look like white noise (random about 0, bell-shaped histogram, ACF spikes inside the bounds). Breusch–Godfrey (regression) or Ljung–Box (others): <b>p &gt; 0.05</b> = no evidence of autocorrelation = good; p &lt; 0.05 = pattern left in the residuals.</p>`,
formulas: [
 {name:"Additive", tex:R`DATA = T + SF`},
 {name:"Multiplicative", tex:R`DATA = T\times SF`},
 {name:"Linear trend (AirPassengers)", tex:R`LT = 84.648 + 2.667t`},
 {name:"Seasonal factor (mult.)", tex:R`SF = \overline{DATA/T}\ \text{for that season}`}
],
questions: [

lectures: "Lectures 8 (Inference) and 9 (Small samples); Tutorials 7 and 9", status: "lectured",
summary: "Why a sample mean needs an interval, the Central Limit Theorem and its simulation, z-intervals for large samples, t-intervals for small normal samples, t.test(), the difference between intervals for the mean and for the data, and normality checks.",
theory: R`
<h3>0. Point estimates aren't enough</h3>
<p>The sample mean $\bar x$ estimates the population mean $\mu$, but another sample gives another $\bar x$ (you might have picked the 50 smallest setosa by chance). Inference puts a range on $\mu$. The sample must be representative (airquality has no winter days).</p>

<h3>1. The Central Limit Theorem</h3>
<p>For large samples ($n \ge 30$), sample means are normally distributed, whatever the population's shape:</p>
$$\bar x \approx N\!\left(\mu,\ \frac{\sigma}{\sqrt n}\right)$$
<p>$\sigma/\sqrt n$ is the <b>standard error</b>. Tutorial 7 simulation:</p>
<pre>pop &lt;- sample(1:100, 10000, replace = TRUE)          # uniform, not normal
means &lt;- vector(length = 1000)
for (i in 1:1000) means[i] &lt;- mean(sample(pop, 40))
plot(density(means))            # bell-shaped
mean(means); sd(means)          # ≈ mean(pop), ≈ sd(pop)/sqrt(40)</pre>

<h3>2. Large-sample interval</h3>
<p>From $P(-1.96 &lt; Z &lt; 1.96) = 0.95$ with $Z = (\bar x - \mu)/(\sigma/\sqrt n)$:</p>
$$\bar x \pm z\frac{\sigma}{\sqrt n},\qquad z = 1.645\ (90\%),\ 1.96\ (95\%),\ 2.58\ (99\%)$$
<p>$\pm 3\sigma/\sqrt n$ (quality control) is 99.73%. With σ unknown (always), use $s$ for $n \ge 30$. Bigger $n$ → narrower; higher confidence → wider.</p>
<pre>qnorm(c(0.025, 0.975))                    # ±1.96
t.test(airquality$Temp)$conf.int           # 76.37 79.39   ← use this in the exam
t.test(airquality$Temp, conf.level = 0.99) # 75.89 79.88</pre>

<h3>3. Small samples ($n &lt; 30$)</h3>
<p><b>Only valid if the data come from a normal population: check first.</b></p>
<pre>qqnorm(x); qqline(x)     # points on the line → normal</pre>
<p>With σ unknown use the <b>t-distribution with n − 1 degrees of freedom</b> (wider, flatter than Z; close to Z by 29 df):</p>
$$\bar x \pm t_{n-1}\frac{s}{\sqrt n}$$
<p>Alloy failure loads ($n$ = 22): $\bar x$ = 13.71, $s$ = 3.55, $t_{0.975,21}$ = 2.08 ⇒ 13.71 ± 1.57 = (12.14, 15.28). <code>t.test(alloy)</code> gives the same. <code>t.test</code> works for large samples too (practically the same as z).</p>
<p>Tutorial 7 normality checks: 1–9 → normal; 1628.75, 1613.63, ... → probably not (only six points; the shape is hard to judge); 0/1 data → not normal. A sample of 5 from a uniform population does not give normal means.</p>

<h3>4. Interval for the mean vs for the data</h3>
<div class="tbl"><table class="data">
<tr><th>Question says</th><th>Means</th><th>Code</th></tr>
<tr><td>"95% CI for the mean [var]", "population mean"</td><td>Where μ lies</td><td><code>t.test(x, conf.level = .95)$conf.int</code></td></tr>
<tr><td>"95% CI for [var]", "middle 95% of the data"</td><td>Where the data lie</td><td><code>quantile(x, c(.025, .975))</code></td></tr>
</table></div>
<p>Framingham sysBP: mean interval (131.69, 133.02), data interval (100.5, 188.0). If someone claims a typical sysBP is 130, we're 95% sure they're wrong.</p>`,

T.topics.push({
id: "twomeans", part: "Inference", title: "Comparing Two Means: Welch & Paired t-Tests",
lectures: "Lectures 10–11; Tutorial 9", status: "lectured",
summary: "Independent vs dependent samples, overlapping intervals, the interval for the difference in means and why 0 is the number to look for, hypothesis-testing language, Welch's t-test for small independent samples, and the paired t-test.",
theory: R`
<h3>0. Independent or dependent?</h3>
<p><b>Dependent</b> (paired): a definite reason to match values, e.g. the same car carrying one tyre of each brand, the same girder tested by two methods, the same subject before and after. <b>Independent</b>: no reason to pair, e.g. tyres worn on a machine, two separate groups of volunteers.</p>

<h3>1. Large independent samples</h3>
<p>Rough approach: build each CI; no overlap ⇒ different means. Better: the CLT for the difference,</p>
$$(\bar x_1 - \bar x_2) \pm 1.96\sqrt{\frac{s_1^2}{n_1} + \frac{s_2^2}{n_2}}$$
<p><b>0 is the important number.</b> 0 inside ⇒ $\mu_1$ could equal $\mu_2$. 0 outside ⇒ different, and the interval says by how much.</p>
<pre>ps  &lt;- subset(iris, Species == "setosa")$Petal.Length
pvs &lt;- subset(iris, Species == "versicolor")$Petal.Length
t.test(ps, pvs)$conf.int     # -2.94 -2.66: setosa petals 2.66–2.94 cm shorter</pre>

<h3>2. Hypothesis testing language</h3>
<p>$H_0$: $\mu_1 = \mu_2$; $H_a$: $\mu_1 \ne \mu_2$. We either reject $H_0$ or fail to reject it (never "prove" $H_0$). 0 outside the 95% CI ⇔ p &lt; 0.05 ⇔ reject $H_0$ at 5%. The maximum confidence at which the means differ is $(1 - p)\times 100\%$.</p>

<h3>3. Small independent samples</h3>
<p>Check <b>each</b> sample is normal (two Q-Q plots). Then Welch's t-interval, with degrees of freedom</p>
$$\nu = \frac{\left(\frac{s_1^2}{n_1} + \frac{s_2^2}{n_2}\right)^2}{\frac{(s_1^2/n_1)^2}{n_1-1} + \frac{(s_2^2/n_2)^2}{n_2-1}},\qquad (\bar x_1-\bar x_2) \pm t_{\nu}\sqrt{\frac{s_1^2}{n_1}+\frac{s_2^2}{n_2}}$$
<pre>t.test(bt, rm, conf.level = 0.9)   # Welch is R's default</pre>

<h3>4. Paired samples</h3>
<p>Work with the differences $d_i = x_i - y_i$. For small samples <b>check the differences are normal</b>, then</p>
$$\bar d \pm t_{n-1}\frac{s_d}{\sqrt n}$$
<pre>d &lt;- m1 - m2; qqnorm(d); qqline(d)
t.test(m1, m2, paired = TRUE)</pre>
<p>Using the unpaired test on paired data gives a different interval and possibly the wrong conclusion.</p>`,
formulas: [
 {name:"Large, independent", tex:R`(\bar x_1-\bar x_2)\pm z\sqrt{\frac{s_1^2}{n_1}+\frac{s_2^2}{n_2}}`},
 {name:"Small, independent (Welch)", tex:R`(\bar x_1-\bar x_2)\pm t_\nu\sqrt{\frac{s_1^2}{n_1}+\frac{s_2^2}{n_2}}`},
 {name:"Paired", tex:R`\bar d \pm t_{n-1}\frac{s_d}{\sqrt n}`},
 {name:"Decision", tex:R`0\in CI \Rightarrow \text{could be equal}`}
],
questions: [
 {src:"Lecture 10 example", see:[1], q:R`Petrol prices: Texgas $n$ = 35, $\bar x$ = €1.48, $s$ = 0.12; Quick-Check $n$ = 40, $\bar x$ = €1.39, $s$ = 0.10. Is Quick-Check cheaper (95%)? Use both approaches.`,
  hint:"Two separate CIs; then the CI for the difference.",
  sol:R`<p>Texgas 1.48 ± 1.96(0.12/√35) = (1.44, 1.52). Quick-Check 1.39 ± 1.96(0.10/√40) = (1.36, 1.42). No overlap.</p>

 {src:"Lecture 11 example", see:[3], q:R`Blowout times (h). Beltex: 3.82, 3.11, 3.21, 2.64, 4.16, 3.51, 2.44. Roadmaster: 4.16, 3.92, 3.94, 4.22, 4.15, 3.62, 4.11. Compare at 90% and 99%.`,

T.topics.push({
id: "variance", part: "Inference", title: "Confidence Intervals for σ & Comparing Variances",
lectures: "Lecture 12 (CIs for the population standard deviation)", status: "lectured",
summary: "Why spread matters in manufacturing, the chi-squared interval for σ (varTest in EnvStats), comparing two variances with the F-distribution and var.test, and why 1 is the number to look for. Normality is required throughout.",
theory: R`
<h3>0. Spread is the quality measure</h3>
<p>Controlling variability is central to operations management. The point estimate of σ is $s$; σ mainly has meaning when compared.</p>

<h3>1. Chi-squared interval for σ</h3>
<p>For a sample from a <b>normal</b> population, $(n-1)s^2/\sigma^2$ has a $\chi^2$ distribution with $n - 1$ df. <code>qchisq(p, df)</code> gives the value with area p to its LEFT: <code>qchisq(c(.025,.975), 5)</code> = (0.83, 12.83).</p>
$$\sqrt{\frac{(n-1)s^2}{\chi^2_{0.975,\,n-1}}}\ \le\ \sigma\ \le\ \sqrt{\frac{(n-1)s^2}{\chi^2_{0.025,\,n-1}}}$$
<pre>library(EnvStats)
qqnorm(samp); qqline(samp)          # must be normal
sqrt(varTest(samp)$conf.int)         # CI for σ  (varTest gives the variance)</pre>
<p>Alloy loads: σ between 2.73 and 5.08 (95%).</p>

<h3>2. Comparing two variances: the F test</h3>
<p>For two independent normal samples with equal variances, $s_1^2/s_2^2$ follows an F distribution with $(n_1 - 1, n_2 - 1)$ df. CI for $\sigma_1^2/\sigma_2^2$:</p>
$$\left(\frac{s_1^2/s_2^2}{F_{0.975}},\ \frac{s_1^2/s_2^2}{F_{0.025}}\right)$$
<pre>var.test(set, ver)                     # CI for the ratio of variances
sqrt(var.test(set, ver)$conf.int)      # ratio of sds
var.test(B, A, alternative = "greater")</pre>
<p><b>1 is the important number.</b> 1 inside ⇒ variances could be equal; outside ⇒ different. Setosa vs versicolor sepal length: ratio (0.26, 0.82), sd ratio (0.51, 0.91): setosa is less variable.</p>`,

 {name:"Decision", tex:R`1\in CI\Rightarrow\ \text{variances could be equal}`}
],

T.topics.push({
id: "anova", part: "Inference", title: "ANOVA, Tukey & Assumption Checks",
lectures: "Lectures 12 (ANOVA) and 13 (ANOVA of the iris data)", status: "lectured",
summary: "Comparing three or more means: the three assumptions (independence, normal residuals, equal variances) and how to check them, aov() and the F test, Tukey's post-hoc comparisons, two-way ANOVA with interaction, and the alternatives when assumptions fail.",
theory: R`
<h3>0. Why ANOVA</h3>
<p>Three or more groups (iris species). Repeated t-tests on every pair inflate the chance of a false difference, so use one ANOVA then a multiple-comparisons procedure. Visualise first with ggplot2 + <code>geom_jitter()</code>.</p>

<h3>1. The three assumptions</h3>
<ol>
<li><b>Independence:</b> random, independent replicates (essential; the F test is sensitive to this). Iris: no reason to pair flowers; we hope they were sampled randomly.</li>
<li><b>Normal residuals:</b> robust to mild departures, especially with large samples.
<pre>library(onewaytests); nor.test(Sepal.Width ~ Species, data = iris)
res &lt;- aov(Sepal.Width ~ Species, data = iris)$residuals
library(car); qqPlot(res); shapiro.test(res)</pre></li>
<li><b>Equal variances:</b> not critical with equal group sizes, but check: visual (<code>plot(iris)</code> ranges), rule of thumb largest/smallest variance ≤ 4 (3–5 depending on author), or Levene's test.
<pre>leveneTest(Sepal.Width ~ Species, data = iris)   # p > 0.05 → equal variances OK</pre>
Sepal width variances (0.144, 0.098, 0.104) pass; petal width (0.011, 0.039, 0.075, ratio ≈ 7) fails.</li>
</ol>

<h3>2. One-way ANOVA and Tukey</h3>
<pre>a &lt;- aov(Sepal.Width ~ Species, data = iris)
summary(a)        # F = 49.2, Pr(>F) &lt; 2e-16 → means not all equal
TukeyHSD(a)       # pairwise differences with adjusted p</pre>
<p>Each Tukey row compares two groups: <code>p adj</code> &lt; 0.05 ⇒ significantly different; its interval excludes 0. Iris: setosa is 0.658 wider than versicolor and 0.454 wider than virginica; virginica 0.204 wider than versicolor (p = 0.009). All three differ.</p>

<h3>3. Two-way ANOVA</h3>
<p>ToothGrowth: <code>len</code> depends on <code>supp</code> (OJ, VC) and <code>dose</code> (0.5, 1, 2), a 2×3 factorial design. Dose is stored as a number, so convert it first.</p>
<pre>tg &lt;- ToothGrowth; tg$dose &lt;- as.factor(tg$dose)
a2 &lt;- aov(len ~ supp * dose, data = tg)
summary(a2)     # supp p = 0.0002, dose p &lt; 2e-16, supp:dose p = 0.022
TukeyHSD(a2)
library(HH); interaction2wt(len ~ supp * dose, data = tg)</pre>
<p>Main effects: OJ gives longer teeth; length rises with dose. Interaction: the effect of dose depends on the supplement (at dose 2, OJ and VC are the same). Equal group sizes keep the factors orthogonal and the assumptions robust. ANOVA is a linear model: the intercept is the OJ/0.5 cell.</p>

<h3>4. When assumptions fail</h3>
<div class="tbl"><table class="data">
<tr><th>Problem</th><th>Use</th></tr>
<tr><td>Unbalanced two-way</td><td>Type II (no interaction) or Type III (<code>car::Anova(m, type = "III")</code>)</td></tr>
<tr><td>Unequal variances, one-way</td><td>Welch: <code>oneway.test(y ~ g, var.equal = FALSE)</code>; Games–Howell post hoc</td></tr>
<tr><td>Unequal variances, two-way</td><td>Robust ANOVA, <code>WRS2::t2way</code></td></tr>
<tr><td>Dependent samples</td><td>Repeated-measures ANOVA (<code>rstatix::anova_test</code>)</td></tr>
<tr><td>Non-normal residuals</td><td>Kruskal–Wallis (one-way), ART (two-way), Friedman (repeated)</td></tr>
</table></div>`,
formulas: [
 {name:"Hypotheses", tex:R`H_0: \mu_1=\mu_2=\cdots=\mu_k`},
 {name:"Variance rule of thumb", tex:R`\frac{s^2_{max}}{s^2_{min}} \le 4`},
 {name:"Decision", tex:R`p < 0.05 \Rightarrow \text{reject } H_0`}
],
questions: [
 {src:"Lecture 13 example", see:[1,2], q:R`Check the assumptions and run a one-way ANOVA on iris Sepal.Width by Species. Which species differ?`,
  hint:"Variance ratio, aov, TukeyHSD.",
  sol:R`<p>Variances 0.144 / 0.098 / 0.104: ratio 1.46 &lt; 4 ✓. Equal group sizes (50). Residuals roughly normal.</p><pre>summary(aov(Sepal.Width ~ Species, iris))   # F = 49.16, p &lt; 2e-16
TukeyHSD(aov(Sepal.Width ~ Species, iris))
# versicolor-setosa -0.658, virginica-setosa -0.454, virginica-versicolor 0.204 (p = 0.0088)</pre><p>All three means differ significantly at 5%.</p>`,
  ans:"All three differ", prov:"Lecture 12/13 example; values checked by Claude in R."},
 {src:"Practice (Claude)", see:[1], q:R`Could you run the same one-way ANOVA on iris Petal.Width?`,
  hint:"Compare the largest and smallest group variances.",
  sol:R`<p>Variances 0.0111 (setosa), 0.0391, 0.0754: ratio ≈ 6.8 &gt; 4, and Levene's test rejects equal variances. Not advisable even with equal group sizes; use Welch's ANOVA (<code>oneway.test(..., var.equal = FALSE)</code>) instead.</p>`,
  ans:"No: variances too unequal (ratio ≈ 6.8)", prov:"Lecture 12 slides make this point; ratio computed by Claude in R."},
 {src:"Final (2025) Q8", see:[3,2], q:R`penguins (palmerpenguins): two-way ANOVA of body_mass_g on species + sex, then Tukey HSD for sex. Conclusion?`,
  hint:"na.omit first; does the Tukey interval include 0?",
  sol:R`<pre>pg &lt;- na.omit(penguins)
a2 &lt;- aov(body_mass_g ~ species + sex, data = pg)
TukeyHSD(a2, "sex")    # male-female 667.5 g, CI (599.2, 735.7), p ≈ 0</pre><p>Males are significantly heavier. (Tukey works fine with two levels.)</p>`, ans:"Male penguins significantly heavier", prov:LOOP+" Marked correct."},
 {src:"Final (2025) Q10", see:[1], q:R`Radon data: dose D (6 levels) and response RR. Run Levene's test and give Pr(>F) (4 dp).`,
  hint:"D must be a factor.",
  sol:R`<pre>leveneTest(RR ~ as.factor(D))   # F = 0.860, Pr(>F) = 0.5261</pre><p>The default <code>center = median</code> gives 0.5261 (mean centring gives 0.3303).</p>`, ans:"0.5261", prov:LOOP+" Marked correct."}
],
traps: [

 "A significant F only says SOME means differ: Tukey says which.",

]

T.topics.push({
id: "nonparam", part: "Inference", title: "Non-Parametric Tests",
lectures: "Tutorial 10", status: "lectured",
summary: "Rank-based alternatives when normality fails: Spearman's rank correlation, the Mann–Whitney U (Wilcoxon rank-sum) test for independent samples, the Wilcoxon signed-rank test for paired samples, their confidence intervals, and bootstrapping.",
theory: R`
<h3>0. Ranks instead of values</h3>
<p>Order all values and replace each with its rank. Robust to outliers and skew, no distribution assumed, works across different scales. But when normality holds, <b>parametric tests are more powerful</b> (more likely to detect a real effect, narrower intervals), so prefer them then.</p>

<h3>1. Which test</h3>
<div class="tbl"><table class="data">
<tr><th>Parametric</th><th>Non-parametric</th><th>R</th></tr>
<tr><td>Pearson correlation</td><td>Spearman's ρ (monotonic relationship)</td><td><code>cor.test(x, y, method = "spearman")</code></td></tr>
<tr><td>Welch two-sample t</td><td>Mann–Whitney U / Wilcoxon rank-sum</td><td><code>wilcox.test(x, y, conf.int = TRUE)</code></td></tr>
<tr><td>Paired t</td><td>Wilcoxon signed-rank</td><td><code>wilcox.test(x, y, paired = TRUE, conf.int = TRUE)</code></td></tr>
<tr><td>One-way ANOVA</td><td>Kruskal–Wallis</td><td><code>kruskal.test(y ~ g)</code></td></tr>
</table></div>
<p>p &lt; 0.05 ⇒ significant difference (or relationship). The <code>conf.int</code> output estimates the location shift (≈ difference in medians; "pseudo-median" for paired); 0 outside ⇒ significant.</p>

<h3>2. Bootstrapping</h3>
<p>Resample the data with replacement many times, compute the statistic each time, and read the interval off its distribution. Used for intervals where no formula exists (e.g. Spearman's ρ):</p>
<pre>library(boot)
f &lt;- function(d, i) cor(d$x[i], d$y[i], method = "spearman")
b &lt;- boot(data.frame(x, y), f, R = 1000)
boot.ci(b, type = "perc")</pre>`,
formulas: [
 {name:"Spearman", tex:R`\rho \in [-1, 1]`, note:"monotonic, rank-based"},
 {name:"Decision", tex:R`p < 0.05 \Rightarrow \text{significant}`}
],
questions: [
 {src:"Tutorial 10 Q1", see:[1], q:R`Girder data (Method 1 x, Method 2 y): Spearman correlation, Mann–Whitney and Wilcoxon signed-rank. Interpret each.`,
  hint:"Which design is the data really?",
  sol:R`<p>Spearman: ρ = 0.33, p = 0.39 → no evidence of a monotonic relationship (bootstrap CI (−0.54, 0.95) includes 0).</p><p>Mann–Whitney: W = 80, p = 8.2×10⁻⁵, shift 0.277, CI (0.135, 0.381) → x higher.</p><p>Signed-rank (the right one, since girders are paired): V = 45, p = 0.0039, pseudo-median 0.268, CI (0.159, 0.390) → Method 1 significantly higher.</p>`,
  ans:"Paired: Method 1 significantly higher", prov:"Tutorial 10 outputs."},
 {src:"Tutorial 10 Q2", see:[1], q:R`Iris Petal.Length, versicolor vs virginica, non-parametrically: (1) independent data; (2) 50 growers each supplying one flower of each species.`,
  hint:"(1) rank-sum; (2) signed-rank.",

wilcox.test(vs, vg, paired = TRUE, conf.int = TRUE)  # V = 3.5, p = 2.1e-9, pseudo-median -1.30 (-1.55, -1.10)</pre><p>Either way virginica petals are significantly longer, by about 1.2–1.3 cm.</p>`,
  ans:"Virginica longer by ≈ 1.2–1.3 cm in both cases", prov:"Tutorial 10 challenge; computed by Claude in R (ties make R use the normal approximation)."},
 {src:"Final (2025) Q6", see:[1], q:R`<code>sleep</code>: the same 10 subjects under two conditions. Use a non-parametric test to compare extra sleep.`,
  hint:"Same subjects → paired.",
  sol:R`<pre>wilcox.test(g2, g1, paired = TRUE, conf.int = TRUE)
# p = 0.0091, pseudo-median 1.40, 95% CI (1.05, 2.95): entirely positive</pre><p>Median extra sleep is significantly higher under condition 2.</p>`, ans:"Condition 2 significantly higher", prov:LOOP+" Marked correct."}
],
traps: [

]

/* EEN1029 Electromechanical Systems — background, Task 1 (inductors and transformers) */
(function(){
const R = String.raw;
const T = STUDY.content.ems = STUDY.content.ems || { topics: [] };

T.topics.push({
id: "acpower", part: "Background & signal conditioning", title: "Phasors, Impedance & AC Power",
lectures: "Phasors and AC Power; Task 1 – Inductor Measurements; Background Notes – Complex Numbers", status: "lectured",
summary: "Sinusoids as phasors, adding waveforms with complex numbers, impedance of R, L and C, leading/lagging, and real, reactive and apparent power with the power triangle. Measuring them all with a two-channel scope. This is Q1 on every past paper.",
theory: R`
<h3>0. Sinusoids</h3>
$$v(t) = V_m\cos(\omega t + \theta),\qquad \omega = 2\pi f,\quad \omega T = 2\pi,\quad f = 1/T$$
<p>The <b>rms</b> value is the dc-equivalent for power in a resistor: $V = V_{rms} = V_m/\sqrt2$. From a peak-to-peak reading: $V_{rms} = V_{pp}/(2\sqrt2)$.</p>

<h3>1. Phasors</h3>
<p>A phasor is a rotating vector frozen at $t=0$: magnitude and phase only. It works for waveforms of the <b>same frequency</b>. To add sinusoids:</p>
<ol class="steps">
<li>Write everything as cosines: $\sin\omega t = \cos(\omega t - 90^\circ)$.</li>
<li>Write each as $V_m\angle\theta$ (i.e. $\text{Re}[V_me^{j(\omega t + \theta)}]$ with $e^{j\omega t}$ dropped).</li>
<li>Convert to rectangular, add, convert back.</li>
</ol>
<p>Lecture example: $10\cos\omega t + 5\sin(\omega t + 60^\circ) + 5\cos(\omega t + 90^\circ) = 10\angle0^\circ + 5\angle{-30^\circ} + 5\angle90^\circ$</p>
<p>$= 10 + (4.33 - j2.5) + j5 = 14.33 + j2.5 = 14.54\angle9.90^\circ$, i.e. $14.54\cos(\omega t + 9.90^\circ)$.</p>

<h3>2. Impedance</h3>
$$Z = R + jX,\qquad \mathbf V = Z\mathbf I\ \text{(Ohm's law in phasor form)}$$
<div class="tbl"><table class="data">
<tr><th>Load</th><th>Impedance</th><th>Phase</th><th>Current</th></tr>
<tr><td>Resistor</td><td>$R$</td><td>$\theta = 0^\circ$</td><td>In phase</td></tr>
<tr><td>Inductor</td><td>$j\omega L$, $X_L = 2\pi fL$</td><td>$\theta = 90^\circ$ (V ahead)</td><td><b>Lags</b> voltage</td></tr>
<tr><td>Capacitor</td><td>$-j/\omega C$, $X_C = 1/2\pi fC$</td><td>$\theta = -90^\circ$</td><td><b>Leads</b> voltage</td></tr>
</table></div>
<p>Memory aid: <b>ELI the ICE man</b>: in L, E (voltage) before I; in C, I before E. $X_L$ grows with frequency; $X_C$ falls with frequency; $L$ and $C$ themselves don't change with frequency. For series R and X: $|Z| = \sqrt{R^2 + X^2}$, $R = |Z|\cos\theta$, $X = |Z|\sin\theta$.</p>

<h3>3. Power</h3>
<p>Instantaneous power $p(t) = v(t)i(t)$. Its mean over a cycle is the <b>real power</b>.</p>
<div class="tbl"><table class="data">
<tr><th>Quantity</th><th>Formula</th><th>Unit</th></tr>
<tr><td>Apparent power $S$</td><td>$V_{rms}I_{rms}$</td><td>VA</td></tr>
<tr><td>Real power $P$</td><td>$S\cos\theta = \langle v(t)i(t)\rangle$</td><td>W</td></tr>
<tr><td>Reactive power $Q$</td><td>$S\sin\theta = I_{rms}^2X$</td><td>var</td></tr>
<tr><td>Power factor</td><td>$P/S = \cos\theta$</td><td>–</td></tr>
<tr><td>Power angle $\theta$</td><td>$\cos^{-1}(P/S)$ = phase of V relative to I</td><td>°</td></tr>
</table></div>
<p>The <b>power triangle</b>: $P$ horizontal, $Q$ vertical, $S$ the hypotenuse at angle $\theta$, so $S = \sqrt{P^2 + Q^2}$. Reactive power is energy stored and returned each cycle; a low power factor means lots of current for little useful power.</p>

<h3>4. Reading θ from a scope plot</h3>
$$\theta = \frac{\Delta t}{T}\times360^\circ$$
<p>where $\Delta t$ is how far the current peak trails the voltage peak (positive = current lags = inductive). Current peaking first = leading = capacitive, $\theta$ negative.</p>

<h3>5. Measuring with a two-channel scope (Task 1 Part A)</h3>
<p>Ch1 across a known series resistor $R_1$ gives the current; Ch2 across the inductor (or load) gives its voltage:</p>
$$I = \frac{V_{rms,Ch1}}{R_1},\quad S = \frac{V_{rms,Ch1}V_{rms,Ch2}}{R_1},\quad P = \frac{\langle v_{Ch1}(t)v_{Ch2}(t)\rangle}{R_1},\quad \cos\theta = \frac{\langle v_{Ch1}v_{Ch2}\rangle}{V_{rms,Ch1}V_{rms,Ch2}}$$
<p>Then $Q = I^2X_L = I^2\omega L$ gives $L = \dfrac{Q}{I^2\omega}$, or equivalently $L = \dfrac{V_{rms,Ch2}R_1\sin\theta}{V_{rms,Ch1}\omega}$. Lecture example: $\langle v_1v_2\rangle = 0.021$ V², $V_1V_2 = 0.0387$ V² ⇒ pf = 0.543.</p>`,
formulas: [
 {name:"RMS", tex:R`V_{rms} = \frac{V_m}{\sqrt2} = \frac{V_{pp}}{2\sqrt2}`},
 {name:"Reactances", tex:R`X_L = 2\pi fL,\quad X_C = \frac{1}{2\pi fC}`},
 {name:"Power angle from scope", tex:R`\theta = \frac{\Delta t}{T}\,360^\circ`},
 {name:"Apparent / real / reactive", tex:R`S = VI,\ P = S\cos\theta,\ Q = S\sin\theta`},
 {name:"Power triangle", tex:R`S^2 = P^2 + Q^2`},
 {name:"Reactive power", tex:R`Q = I^2X`},
 {name:"Real power (scope)", tex:R`P = \langle v(t)\,i(t)\rangle`},
 {name:"Series R–X", tex:R`|Z| = \frac{V}{I} = \sqrt{R^2+X^2},\ X = |Z|\sin\theta`}
],
questions: [
 {src:"Exam 2025 Q1(b)", see:[4,3,2], q:R`A resistor $R$ in series with an inductor $L$ is fed from 7.07 V rms at 50 Hz. The scope shows $V_{pp} = 20$ V and $I_{pp} = 200$ mA, with the current peak 2.5 ms after the voltage peak. Find the power angle, $S$, $P$, $Q$, the reactance and the inductance.`,
  hint:"θ = (2.5/20)·360°. rms values from p-p. Then Q = I²X and X = ωL.",
  sol:R`<p>$\theta = \dfrac{2.5}{20}360^\circ = 45^\circ$ (current lags: inductive).</p>
  <p>$V = 20/(2\sqrt2) = 7.07$ V, $I = 0.2/(2\sqrt2) = 70.7$ mA, $S = 0.500$ VA.</p>
  <p>$P = 0.5\cos45^\circ = 0.354$ W; $Q = 0.5\sin45^\circ = 0.354$ var.</p>
  <p>$X = Q/I^2 = 0.354/0.0707^2 = 70.8$ Ω; $L = X/2\pi f = 70.8/314.2 = 225$ mH.</p>`,
  ans:"45°, 0.5 VA, 0.354 W, 0.354 var, 70.8 Ω, 225 mH", prov:"Follows the posted exam solution."},
 {src:"Exam 2025 Q1(c)", see:[2], q:R`For the same circuit, what happens to (i) the inductance and (ii) the reactance if the frequency goes from 50 Hz to 500 Hz?`,
  hint:"Which one has f in its formula?",
  sol:R`<p>(i) $L$ is a property of the coil: <b>unchanged</b>.</p><p>(ii) $X = 2\pi fL$: increases 10×, to about 708 Ω.</p>`,
  ans:"L unchanged; X ×10", prov:"Follows the posted exam solution."},
 {src:"Exam 2026 Q1(b)", see:[4,2], q:R`$R$ in series with unknown component $x$, 7.07 V rms at 50 Hz, $V_{pp} = 20$ V, $I_{pp} = 200$ mA. The voltage peaks 2.5 ms <i>after</i> the current. Is $x$ capacitive or inductive? Find the power angle, impedance and reactance.`,
  hint:"Current peaking first = current leads.",
  sol:R`<p>Current leads ⇒ <b>capacitive</b>. $\theta = -\dfrac{2.5}{20}360^\circ = -45^\circ$.</p>
  <p>$|Z| = V_m/I_m = 10/0.1 = 100$ Ω.</p>
  <p>$X_C = |Z|\sin\theta = 100\sin(-45^\circ) = -70.7$ Ω (and $R = 70.7$ Ω).</p>`,
  ans:"Capacitive; −45°; 100 Ω; −70.7 Ω", prov:"Follows the posted exam solution."},
 {src:"Exam 2026 Q1(c)", see:[2], q:R`For that RC circuit, predict how doubling the frequency to 100 Hz changes (i) the impedance and (ii) the reactance.`,
  hint:"X_C ∝ 1/f; R doesn't change.",
  sol:R`<p>$X_C$ halves: 70.7 → 35.4 Ω. $R$ stays 70.7 Ω.</p>
  <p>$|Z| = \sqrt{70.7^2 + 35.4^2} = 79.0$ Ω: it falls, but by less than the reactance does.</p>`,
  ans:"X: 70.7 → 35.4 Ω; Z: 100 → 79 Ω", prov:"Follows the posted exam solution."},
 {src:"Lecture example (phasors)", see:[1], q:R`Express $v(t) = 10\cos\omega t + 5\sin(\omega t + 60^\circ) + 5\cos(\omega t + 90^\circ)$ as a single sinusoid.`,
  hint:"Convert the sine to a cosine first (subtract 90°).",
  sol:R`<p>$5\sin(\omega t + 60^\circ) = 5\cos(\omega t - 30^\circ)$.</p>
  <p>$10 + (4.33 - j2.5) + j5 = 14.33 + j2.5 = 14.54\angle9.90^\circ$</p>
  <p>$v(t) = 14.54\cos(\omega t + 9.90^\circ)$</p>`,
  ans:"14.54 cos(ωt + 9.90°)", prov:"From the worked example in the Phasors and AC Power lecture."},
 {src:"Exam 2025 Q1(a)", see:[3], q:R`Sketch the power triangle and explain the difference between instantaneous power and real power, with a formula linking them.`,
  hint:"One is a value at an instant; the other is a mean.",
  sol:R`<p>Triangle: $P = S\cos\theta$ horizontal, $Q = S\sin\theta$ vertical, $S = \sqrt{P^2+Q^2}$ hypotenuse, $\theta$ between $P$ and $S$.</p>
  <p>Instantaneous power $p(t) = v(t)i(t)$ at one moment; real power is its mean over a cycle: $P = \langle p(t)\rangle$.</p>`,
  ans:"P = ⟨v(t)i(t)⟩", prov:"Follows the posted exam solution."}
],

]

T.topics.push({
id: "sigcond", part: "Background & signal conditioning", title: "Op-Amps & Signal Conditioning for the ESP32",
lectures: "Background Notes – Operational Amplifiers, Overview of Amplifiers; scope front-end exam questions", status: "lectured",
summary: "Ideal op-amp rules and the standard circuits, then the exam's favourite design: scaling, offsetting and buffering a ±V signal into the ESP32's 0–3.3 V input without clipping or loading.",
theory: R`
<h3>0. Ideal op-amp rules</h3>
<ul>
<li>Infinite open-loop gain: with negative feedback, $V_+ = V_-$.</li>
<li>Infinite input impedance: no current flows into the inputs.</li>
</ul>
<div class="tbl"><table class="data">
<tr><th>Circuit</th><th>Output</th></tr>
<tr><td>Non-inverting</td><td>$V_{out} = \left(1 + \dfrac{R_1}{R_2}\right)V_{in}$</td></tr>
<tr><td>Inverting</td><td>$V_{out} = -\dfrac{R_2}{R_1}V_{in}$</td></tr>
<tr><td>Differential (equal ratios)</td><td>$V_{out} = \dfrac{R_2}{R_1}(V_1 - V_2)$</td></tr>
<tr><td>Inverting summer</td><td>$V_{out} = -(V_1 + V_2)$ (equal resistors)</td></tr>
<tr><td>Voltage follower</td><td>$V_{out} = V_{in}$ (buffer: high $Z_{in}$, low $Z_{out}$)</td></tr>
<tr><td>Integrator</td><td>$V_{out} = -\dfrac{1}{RC}\int V_{in}\,dt$</td></tr>
<tr><td>Differentiator</td><td>$V_{out} = -RC\dfrac{dV_{in}}{dt}$</td></tr>
</table></div>

<h3>1. Design requirements and objectives</h3>
<p><b>Requirement:</b> for the full input range (e.g. ±20 V), the output must stay within the ESP32's 0–3.3 V.</p>
<p><b>Objectives:</b> keep the signal linear over the full range; add as little noise as possible; load the measurand as little as possible.</p>

<h3>2. The standard front-end</h3>
<ol class="steps">
<li><b>Scale</b> with a divider $R_1$–$R_2$: $v_{scale} = v_{in}\dfrac{R_2}{R_1+R_2}$. $R_1$ is large (1 MΩ) to give high input impedance.</li>
<li><b>Offset</b> to mid-rail with a second divider from 5 V ($R_3$–$R_4$): $v_{OS} = 5\dfrac{R_4}{R_3+R_4} \approx 1.65$ V, so a bipolar signal sits between 0 and 3.3 V.</li>
<li><b>Buffer</b> with a rail-to-rail op-amp powered from 0 and 3.3 V: unity gain, very high input impedance (little loading), and its output physically can't leave 0–3.3 V, which protects the pin.</li>
<li>A second op-amp as a voltage follower can provide a stiff 3.3 V reference rail.</li>
</ol>

<h3>3. Diagnosing clipping</h3>
<ul>
<li>Clipped equally top and bottom ⇒ bias right, <b>scaling</b> wrong: shrink the divider ratio (change $R_2$, keep $R_1$ big).</li>
<li>Clipped only at the top (or bottom) ⇒ <b>offset</b> wrong: fix the $R_3$–$R_4$ divider.</li>
<li>Check both extremes: $0 < v_{scale,min} + v_{OS}$ and $v_{scale,max} + v_{OS} < 3.3$ V.</li>
</ul>

<h3>4. Simple logic-level shifting</h3>
<p>A 5 V digital signal (encoder, Hall sensor) into a 3.3 V pin needs only a divider: $V_{out} = V_{in}\dfrac{R_2}{R_1+R_2}$ with ratio ≤ 0.66. E.g. 1.8 kΩ / 3.3 kΩ ⇒ 3.24 V; 2 kΩ / 3.3 kΩ ⇒ 3.1 V. Current ≈ 1 mA: negligible power, but big enough that pin leakage doesn't upset it.</p>`,
formulas: [
 {name:"Golden rules", tex:R`V_+ = V_-,\quad I_{in} = 0`},
 {name:"Non-inverting", tex:R`\frac{V_{out}}{V_{in}} = 1 + \frac{R_1}{R_2}`},
 {name:"Inverting", tex:R`\frac{V_{out}}{V_{in}} = -\frac{R_2}{R_1}`},
 {name:"Divider", tex:R`V_{out} = V_{in}\frac{R_2}{R_1+R_2}`},
 {name:"Scaling condition", tex:R`\frac{R_1+R_2}{R_2} \ge \frac{V_{in,pp}}{3.3\text{ V}}`}
],
questions: [
 {src:"Exam 2025 Q3(c)", see:[2,3], q:R`A scope front-end feeds a ±20 V measurand to an ESP32 (0–3.3 V) via a divider $R_1 = 1$ MΩ, $R_2$, a 1.65 V offset and a rail-to-rail buffer. The output is a correctly-centred sine clipped equally at 0 V and 3.3 V. Diagnose and redesign.`,
  hint:"Equal clipping top and bottom means the bias is fine and the gain is too high.",
  sol:R`<p>The output stays in range (requirement met) but is clipped, so linearity (an objective) fails. Equal clipping ⇒ offset fine, <b>scaling</b> wrong.</p>
  <p>Keep $R_1 = 1$ MΩ (high input impedance) and pick $R_2$ so 40 V p-p becomes ≤ 3.3 V p-p:</p>
  <p>$\dfrac{R_1 + R_2}{R_2} \ge \dfrac{40}{3.3} \Rightarrow R_2 \le \dfrac{1\text{ MΩ}}{40/3.3 - 1} = 89.9$ kΩ</p>
  <p>Use 88.7 kΩ or 82 kΩ; everything else unchanged.</p>`,
  ans:"R₂ ≤ 89.9 kΩ (e.g. 82 kΩ)", prov:"Follows the posted exam solution."},
 {src:"Sample 2025 Q3(c)", see:[2,3], q:R`Same front-end for ±50 V with $R_1 = 1$ MΩ, $R_2 = 30$ kΩ, offset divider $R_3$–$R_4$ (with $R_4 = 2$ kΩ) from 5 V. The output runs from about 1 V and is clipped at 3.3 V on top only. Find what's wrong and fix it.`,
  hint:"Clipping on one side only points at the offset.",
  sol:R`<p>Scaling: $\pm50 \times \dfrac{30k}{1.03M} = \pm1.45$ V, which fits a 3.3 V span. Clipping only at the top ⇒ the offset is too high.</p>
  <p>Target $v_{OS} = 1.65$ V: $R_3 = (5/1.65 - 1)(2\text{ kΩ}) = 4.06$ kΩ ⇒ use 4 kΩ, giving 1.67 V.</p>
  <p>Check: $1.67 + 1.45 = 3.12$ V < 3.3 V and $1.67 - 1.45 = 0.22$ V > 0 V ✓.</p>`,
  ans:"R₃ ≈ 4 kΩ (offset 1.67 V)", prov:"Follows the posted sample-paper solution."},
 {src:"Exam 2025 Q3(b)", see:[2], q:R`In the front-end, OpAmp_A is a voltage follower on a 3.3 V reference whose output powers OpAmp_B; OpAmp_B is a unity-gain buffer on the signal path. Explain each one's purpose.`,
  hint:"Think about loading and about what a rail-to-rail op-amp can output.",
  sol:R`<p><b>OpAmp_A:</b> a buffered, stiff 3.3 V supply for OpAmp_B's positive rail, unaffected by loading.</p>
  <p><b>OpAmp_B:</b> very high input impedance, so the circuit hardly loads the measurand; and being rail-to-rail on 0/3.3 V rails, its output is clamped to 0–3.3 V, protecting the ESP32 pin.</p>`,
  ans:"Reference buffer; signal buffer + clamp", prov:"Follows the posted exam solution."},
 {src:"Exam 2026 Q3(a)", see:[4], q:R`A Hall-effect encoder outputs 0–5 V into ESP32 pins rated 0–3.3 V via $R_1$ (series) and $R_2$ (to ground). Explain their purpose and choose values.`,
  hint:"Ratio R₂/(R₁+R₂) ≤ 0.66 using standard values.",
  sol:R`<p>They form a divider that linearly attenuates the 5 V logic level to ≤ 3.3 V (shape, frequency and phase unchanged), so the pin's absolute maximum isn't exceeded.</p>
  <p>$R_1 = 1.8$ kΩ, $R_2 = 3.3$ kΩ: $5 \times \dfrac{3.3}{5.1} = 3.24$ V. Current ≈ 1 mA.</p>`,
  ans:"1.8 kΩ / 3.3 kΩ → 3.24 V", prov:"Follows the posted exam solution."}
],
traps: [
 "Change R₂, not R₁: R₁ sets the input impedance and should stay large.",
 "Equal top/bottom clipping = scale problem; one-sided clipping = offset problem.",
 "Always check both extremes after a redesign (max and min input).",
 "Divider ratio is R₂/(R₁+R₂) with R₂ the resistor to ground.",
 "A rail-to-rail buffer protects the pin but doesn't fix clipping: the signal is still distorted."
]
});

T.topics.push({
id: "magnetics", part: "Task 1: Inductors & transformers", title: "Magnetism, Inductance & Magnetic Circuits",
lectures: "Task 1 – Inductance and Ideal Transformers; Task 1 Supporting Notes", status: "lectured",
summary: "Flux and flux density, the field of a wire and a solenoid, flux linkage and Faraday's law, inductance, B and H, permeability, saturation and hysteresis, and magnetic circuits with reluctance (including air gaps).",
theory: R`
<h3>0. Flux and fields</h3>
<p>Magnetic flux through a surface: $\Phi = \iint B\cdot dA$ (Wb), so $B$ (T) is the <b>flux density</b>. Flux lines run from north to south and form closed loops.</p>
<ul>
<li>Long straight wire (Biot–Savart): $B = \dfrac{\mu_0}{4\pi}\dfrac{2I}{r}$; direction by the right-hand rule.</li>
<li>Solenoid: $B = \mu_0 NI$ per unit length (field proportional to turns × current).</li>
</ul>

<h3>1. Faraday and inductance</h3>
<p>Flux linkage $\lambda = N\Phi$. A changing flux induces an emf:</p>
$$e = N\frac{d\Phi}{dt}$$
<p>Inductance is flux linkage per amp: $L = \lambda/i$, so $e = L\dfrac{di}{dt}$. Unit: henry (H). A conductor moving through a field also has an emf $e = Blu$ (used for motors).</p>

<h3>2. B, H and permeability</h3>
<p>$H$ (A/m) is set by the currents alone; $B$ also includes the material's magnetisation:</p>
$$B = \mu H = \mu_0\mu_rH,\qquad \mu_0 = 4\pi\times10^{-7}\text{ H/m}$$
<p>Ampère's circuital law: $\oint H\cdot dl = \sum i$, which for a uniform path becomes $Hl = Ni$.</p>
<ul>
<li>Ferromagnetic: $\mu \gg \mu_0$ (iron, ferrite). Paramagnetic: slightly above $\mu_0$. Diamagnetic: slightly below.</li>
<li>Above the <b>Curie temperature</b> a ferromagnet becomes merely paramagnetic.</li>
</ul>

<h3>3. Saturation and hysteresis</h3>
<p>$B$–$H$ is non-linear. Once all domains are aligned the core <b>saturates</b> (iron: about 1–2 T) and $B$ only grows as if $\mu_r = 1$. Cycling $H$ traces a <b>hysteresis loop</b>: when $H$ returns to zero a residual $B$ remains (the core "remembers"). The area inside the loop is energy turned into heat per cycle, so hysteresis loss ∝ frequency.</p>

<h3>4. Magnetic circuits</h3>
<p>Treat the core like a circuit:</p>
<div class="tbl"><table class="data">
<tr><th>Magnetic</th><th>Electrical analogue</th></tr>
<tr><td>mmf $\mathcal F = Ni$ (A·turns)</td><td>voltage source</td></tr>
<tr><td>flux $\Phi$</td><td>current</td></tr>
<tr><td>reluctance $\mathcal R = \dfrac{l}{\mu A}$</td><td>resistance $R = \dfrac{l}{\sigma A}$</td></tr>
<tr><td>$\mathcal F = \Phi\mathcal R$</td><td>Ohm's law</td></tr>
</table></div>
<p>Series reluctances add; mmfs round a loop sum to zero; flux in = flux out at a junction.</p>
$$L = \frac{N^2}{\mathcal R_c + \mathcal R_g},\qquad \mathcal R_g = \frac{l_g}{\mu_0A_g}$$
<p>An <b>air gap</b> dominates the total reluctance. It lowers $L$, raises the saturation current $I_{sat} = \dfrac{B_{sat}A_c(\mathcal R_c + \mathcal R_g)}{N}$, and makes $L$ much less sensitive to the core's permeability.</p>`,
formulas: [
 {name:"Flux", tex:R`\Phi = \iint B\cdot dA \approx BA`},
 {name:"Faraday", tex:R`e = N\frac{d\Phi}{dt} = L\frac{di}{dt}`},
 {name:"Inductance", tex:R`L = \frac{N\Phi}{i} = \frac{N^2}{\mathcal R}`},
 {name:"B–H", tex:R`B = \mu_0\mu_rH`},
 {name:"Ampère", tex:R`Hl = Ni`},
 {name:"Reluctance", tex:R`\mathcal R = \frac{l}{\mu A}`},
 {name:"Magnetic Ohm's law", tex:R`Ni = \Phi(\mathcal R_c + \mathcal R_g)`}
],
questions: [
 {src:"Practice (Claude)", see:[4], q:R`A ferrite core has mean path 0.1 m, area $1\ \text{cm}^2$ and $\mu_r = 2000$, with a 1 mm air gap. With 100 turns, find the core and gap reluctances and the inductance. What would $L$ be with no gap?`,
  hint:"R = l/(μA) for each part; L = N²/R_total.",
  sol:R`<p>$\mathcal R_c = \dfrac{0.1}{2000(4\pi\times10^{-7})(10^{-4})} = 3.98\times10^5$ A/Wb</p>
  <p>$\mathcal R_g = \dfrac{10^{-3}}{(4\pi\times10^{-7})(10^{-4})} = 7.96\times10^6$ A/Wb (20× the core)</p>
  <p>$L = \dfrac{100^2}{8.36\times10^6} = 1.20$ mH. Without the gap: $L = 10^4/3.98\times10^5 = 25$ mH.</p>`,
  ans:"R_c ≈ 0.40 MA/Wb, R_g ≈ 7.96 MA/Wb, L ≈ 1.2 mH (25 mH ungapped)", prov:"Worked by Claude to practise the magnetic-circuit method. Not from your course files."},
 {src:"Practice (Claude)", see:[3], q:R`Why does the hysteresis loss of a core rise with frequency, and why does a gapped core saturate at a higher current?`,
  hint:"Loss per cycle vs cycles per second; I_sat formula.",
  sol:R`<p>Each trip round the loop turns a fixed energy (the loop area × volume) into heat, so power = energy per cycle × cycles per second ∝ $f$.</p>
  <p>$I_{sat} = \dfrac{B_{sat}A_c(\mathcal R_c + \mathcal R_g)}{N}$: the gap adds a large reluctance, so more current is needed to drive the core flux up to $B_{sat}$.</p>`,
  ans:"Loss ∝ f; gap raises total reluctance", prov:"Worked by Claude from the Task 1 supporting notes."}
],
traps: [
 "L = N²/R: inductance scales with turns SQUARED.",
 "An air gap usually dominates the reluctance even if it's tiny, because μ₀ ≪ μ_core.",
 "H depends only on the currents; B also depends on the material.",
 "Saturation happens around 1–2 T for iron: beyond it μ_r effectively drops to 1."
]
});

T.topics.push({
id: "transformers", part: "Task 1: Inductors & transformers", title: "Ideal & Real Transformers: No-Load and Short-Circuit Tests",
lectures: "Task 1 – Inductance and Ideal Transformers; Supporting Notes §3.3–3.12", status: "lectured",
summary: "Mutual inductance and the dot convention, ideal transformer voltage, current and impedance ratios, the real transformer model, core and copper losses, laminations, and the two tests (with a two-channel scope) that measure the model. Q2 on every past paper.",
theory: R`
<h3>0. Mutual inductance</h3>
<p>Two coils on one core share flux. The self-terms are $\lambda_{11} = L_1i_1$, $\lambda_{22} = L_2i_2$; the shared terms are $\lambda_{12} = Mi_2$, $\lambda_{21} = Mi_1$, so $\lambda_1 = L_1i_1 \pm Mi_2$. The <b>dot convention</b> sets the sign: currents into both dotted ends make the fluxes add.</p>

<h3>1. The ideal transformer</h3>
<p>Same flux through both windings (Faraday) and zero net mmf (infinite permeability):</p>
$$\frac{v_p}{v_s} = \frac{N_p}{N_s},\qquad \frac{i_p}{i_s} = \frac{N_s}{N_p},\qquad p_{in} = p_{out}$$
<p>$N_p > N_s$: step-down; $N_p < N_s$: step-up. Turns ratio $n = N_s/N_p$.</p>
<p><b>Reflecting impedance:</b> a load $Z_L$ on the secondary looks like</p>
$$Z_L' = \left(\frac{N_1}{N_2}\right)^2Z_L$$
<p>from the primary. E.g. $N_1 = 50$, $N_2 = 100$, 100 Ω load ⇒ 25 Ω seen at the primary.</p>

<h3>2. The real transformer model</h3>
<p>Series branches $R_1$, $L_1$ (primary) and $R_2$, $L_2$ (secondary) around a shunt branch $L_M \parallel R_C$, then an ideal transformer.</p>
<div class="tbl"><table class="data">
<tr><th>Element</th><th>Represents</th></tr>
<tr><td>$R_1$, $R_2$</td><td>Copper (winding) resistance: $I^2R$ "copper losses"</td></tr>
<tr><td>$L_1$, $L_2$</td><td><b>Leakage</b> flux that links only one winding; energy stored and returned each cycle</td></tr>
<tr><td>$L_M$</td><td><b>Magnetising</b> inductance: finite core permeability (non-zero reluctance) needs a magnetising current $I_M$ to set up the flux; $L_M = N_1^2/\mathcal R$</td></tr>
<tr><td>$R_C$</td><td><b>Core loss</b>: hysteresis (loop area × f) and eddy currents (induced circulating currents heating the core)</td></tr>
</table></div>
<p><b>Laminations</b>: thin iron sheets insulated from each other, oriented so the induced emfs are across the insulation. That breaks up eddy-current paths and cuts the $R_C$ losses. Skin effect at high frequency also raises winding resistance.</p>

<h3>3. No-load (open-circuit) test → $R_C$, $L_M$</h3>
<p>Secondary open, rated voltage on the primary. Only the shunt branch carries current (the series parts are negligible). Scope: Ch1 across a sense resistor $R_{Ch1}$ (current), Ch2 across the primary (voltage).</p>
$$I = \frac{V_{rms,Ch1}}{R_{Ch1}},\quad V = V_{rms,Ch2},\quad P = \frac{\langle v_{Ch1}v_{Ch2}\rangle}{R_{Ch1}}$$
$$R_C = \frac{V^2}{P},\quad I_C = \frac{V}{R_C},\quad I_M = \sqrt{I^2 - I_C^2},\quad L_M = \frac{V}{2\pi fI_M}$$

<h3>4. Short-circuit test → $R_{eq}$, $L_{eq}$</h3>
<p>One winding shorted (usually the low-voltage side), a small voltage applied to the other until <b>rated current</b> flows. The shunt branch is a much higher impedance and the voltage is low, so core losses are negligible; only the series branch remains.</p>
$$R_{eq} = \frac{P_{SC}}{I_{SC}^2},\quad |Z_{eq}| = \frac{V_{SC}}{I_{SC}},\quad X_{eq} = \sqrt{Z_{eq}^2 - R_{eq}^2},\quad L_{eq} = \frac{X_{eq}}{2\pi f}$$
<p>Referred to the HV side: $R_{eq,HV} = R_1/a^2 + R_2$, $L_{eq,HV} = L_1/a^2 + L_2$ with $a = N_1/N_2$.</p>

<h3>5. How losses change</h3>
<ul>
<li>Core loss $P = V^2/R_C$ and magnetising $Q = V^2/X_M$ depend on the <b>applied voltage</b>: halve $v_P$, quarter them. They don't depend on the load.</li>
<li>Copper loss $P_{Cu} = i_P^2R_1 + i_S^2R_2$ depends on the <b>currents</b>: with a fixed load, $P_{Cu} \propto v_P^2$; with fixed $v_P$, $P_{Cu} \propto 1/R_{load}^2$.</li>
</ul>`,
formulas: [
 {name:"Voltage ratio", tex:R`\frac{v_p}{v_s} = \frac{N_p}{N_s}`},
 {name:"Current ratio", tex:R`\frac{i_p}{i_s} = \frac{N_s}{N_p}`},
 {name:"Reflected impedance", tex:R`Z' = \left(\frac{N_1}{N_2}\right)^2Z_L`},
 {name:"No-load: core resistance", tex:R`R_C = \frac{V^2}{P}`},
 {name:"No-load: magnetising", tex:R`L_M = \frac{V}{2\pi f\sqrt{I^2 - (V/R_C)^2}}`},
 {name:"Short-circuit", tex:R`R_{eq} = \frac{P}{I^2},\ X_{eq} = \sqrt{(V/I)^2 - R_{eq}^2}`},
 {name:"Core vs copper loss", tex:R`P_{core} = \frac{V^2}{R_C},\quad P_{Cu} = i_P^2R_1 + i_S^2R_2`}
],
questions: [
 {src:"Exam 2025 Q2(a)", see:[2], q:R`For the real transformer model, explain what $L_M$ and $R_C$ represent and why laminated cores are used.`,
  hint:"One is about finite permeability, the other about two loss mechanisms in the iron.",
  sol:R`<p>$L_M$: the core has non-zero reluctance (finite permeability), so a magnetising current is needed to set up the working flux. (It's non-linear in reality because of saturation, usually ignored in the model.)</p>
  <p>$R_C$: power lost in the core to hysteresis (energy per cycle = loop area, so ∝ f) and eddy currents (induced circulating currents heating the iron).</p>
  <p>Laminations: thin insulated sheets with the insulation across the induced emf direction, blocking eddy-current paths and reducing the $R_C$ loss.</p>`,
  ans:"Magnetising; hysteresis + eddy losses; laminations cut eddy currents", prov:"Follows the posted exam solution."},
 {src:"Exam 2025 Q2(b)", see:[3], q:R`Identify a test to find $L_M$ and $R_C$, describe how to do it with a two-channel scope, and derive expressions for them from the measurements.`,
  hint:"Which test makes the series branch irrelevant?",
  sol:R`<p><b>No-load (open-circuit) test</b>: secondary open, rated voltage on the primary through a sense resistor $R_{Ch1}$.</p>
  <p>Ch1 across $R_{Ch1}$ (current), Ch2 across the primary (voltage). Measure $V_{rms,Ch1}$, $V_{rms,Ch2}$ and $\langle v_{Ch1}v_{Ch2}\rangle$.</p>
  <p>$I = V_{rms,Ch1}/R_{Ch1}$, $V = V_{rms,Ch2}$, $P = \langle v_{Ch1}v_{Ch2}\rangle/R_{Ch1}$</p>
  <p>$R_C = V^2/P$; $I_C = V/R_C$; $I_M = \sqrt{I^2 - I_C^2}$; $L_M = \dfrac{V}{2\pi f I_M} = \dfrac{V}{2\pi f\sqrt{I^2 - P^2/V^2}}$</p>`,
  ans:"No-load test; R_C = V²/P; L_M = V/(2πf·√(I² − (P/V)²))", prov:"Follows the posted exam solution (which prints ⟨v_Ch1·v_Ch1⟩; the product needed is Ch1 × Ch2)."},
 {src:"Sample 2025 Q2(b)", see:[4], q:R`For a 50:100 turn transformer, identify a test to find the equivalent coil resistance and leakage inductance referred to the HV side, and derive them from scope measurements.`,
  hint:"Short one winding, drive rated current through the other.",
  sol:R`<p><b>Short-circuit test</b>: short the LV winding, apply a small voltage to the HV winding until rated current flows. The shunt branch is a far higher impedance and core loss is negligible at this low voltage.</p>
  <p>$I_{SC} = V_{rms,Ch1}/R_{Ch1}$, $V_{SC} = V_{rms,Ch2}$, $P_{SC} = \langle v_{Ch1}v_{Ch2}\rangle/R_{Ch1}$</p>
  <p>$R_{eq,HV} = P_{SC}/I_{SC}^2$; $Z = V_{SC}/I_{SC}$; $X_{eq} = \sqrt{Z^2 - R_{eq}^2}$; $L_{eq,HV} = X_{eq}/2\pi f$</p>`,
  ans:"Short-circuit test; R = P/I², L = √((V/I)² − R²)/2πf", prov:"Follows the posted sample-paper solution."},
 {src:"Exam 2025 Q2(c)", see:[5], q:R`In normal operation, how are the losses in $L_M$ and $R_C$ affected by (i) a decrease in $v_P$, (ii) a decrease in $R_{load}$?`,
  hint:"The shunt branch only sees the applied voltage.",
  sol:R`<p>(i) $P = V^2/R_C$ and $Q = V^2/X_M$: both fall <b>quadratically</b>.</p>
  <p>(ii) The load changes the winding currents, not $v_P$: core $P$ and $Q$ are <b>unchanged</b>.</p>`,
  ans:"(i) both ∝ v_P²; (ii) unchanged", prov:"Follows the posted exam solution."},
 {src:"Exam 2026 Q2(c)", see:[5], q:R`With a resistive load, how does a decrease in $v_P$ affect the losses in (i) $R_C$ and (ii) $R_1$?`,
  hint:"For R₁, follow the currents through the turns ratio.",
  sol:R`<p>(i) $P_{core} = V^2/R_C$: decreases quadratically.</p>
  <p>(ii) $v_S = v_P N_2/N_1$, $i_S = v_S/R_{load}$, $i_P = i_SN_2/N_1$: all proportional to $v_P$, so $P_{Cu} \propto v_P^2$: also quadratic.</p>`,
